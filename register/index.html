<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Daftar - Sitenexs</title>
    <meta name="description" content="Halaman pendaftaran akun Sitenexs." />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary: #3b82f6; 
            --primary-dark: #1e40af;
            --bg-body: #f8fafc;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --border-light: #e2e8f0;
            --border-focus: #93c5fd;
            
            --shadow-card: 0 20px 40px -8px rgba(15, 23, 42, 0.12), 0 8px 16px -4px rgba(15, 23, 42, 0.08);
            
            --radius-sm: 8px;
            --radius-md: 16px; 
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: var(--bg-body);
            
            /* GRID GARIS KOTAK DENGAN GRADASI BIRU SITENEXS */
            background-image: 
                radial-gradient(ellipse at 50% 0%, rgba(59, 130, 246, 0.12) 0%, transparent 70%),
                linear-gradient(to right, rgba(59, 130, 246, 0.16) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(30, 64, 175, 0.14) 1px, transparent 1px);
            background-size: 100% 100%, 36px 36px, 36px 36px;
            background-attachment: fixed;
            background-position: center top, center top, center top;

            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            -webkit-font-smoothing: antialiased;
            overflow-x: hidden;
        }

        a { text-decoration: none; color: inherit; transition: 0.2s; }
        button, input, select, textarea { font: inherit; outline: none; border: none; }

        /* Wrapper Navbar Sticky */
        .header-wrapper {
            position: sticky;
            top: 0;
            z-index: 999;
            width: 100%;
            background: rgba(255, 255, 255, 0.92);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            border-bottom: 1px solid var(--border-light);
        }

        .topbar {
            width: 100%;
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
            height: 64px;
            padding: 0 1.5rem;
        }

        .brand {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            font-weight: 700;
            font-size: 1.1rem;
        }

        .brand-mark {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            object-fit: cover;
            border: 1px solid var(--border-light);
        }

        .brand-text {
            background: linear-gradient(135deg, #1e40af 0%, #3b82f6 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .back-link {
            color: var(--text-muted);
            font-size: 1.2rem;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            transition: all 0.2s;
        }
        .back-link:hover { color: var(--primary); background: #eff6ff; }

        .auth-wrap {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 100%;
            padding-bottom: 2rem;
        }

        .slider-viewport {
            width: 100%;
            overflow: hidden;
            padding: 2rem 0; 
            position: relative;
        }

        .card-track {
            display: flex;
            width: 400%; 
            transition: transform 0.6s cubic-bezier(0.22, 1, 0.36, 1);
            align-items: center;
        }

        .slide-wrapper {
            width: 25%; 
            display: flex;
            justify-content: center;
            padding: 0 1rem;
        }

        .card {
            width: 100%;
            max-width: 520px; 
            background: #ffffff;
            border: 1px solid var(--border-light);
            box-shadow: var(--shadow-card);
            border-radius: var(--radius-md);
            padding: 3rem 2.5rem; 
            
            transform: scale(0.95);
            opacity: 0.4;
            transition: all 0.6s cubic-bezier(0.22, 1, 0.36, 1);
            margin: 0 auto;
            height: max-content; 
        }

        .slide-wrapper.active .card {
            transform: scale(1);
            opacity: 1;
        }

        .header-text { text-align: center; margin-bottom: 2rem; }

        h1 {
            font-size: 1.8rem; 
            font-weight: 800; 
            margin: 0 auto 0.4rem auto;
            background: linear-gradient(135deg, #1e40af 0%, #3b82f6 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            display: block; 
            width: fit-content; 
        }

        .subtext {
            color: var(--text-muted);
            font-size: 0.95rem;
            margin: 0;
            display: block;
        }
        
        .step-indicator {
            font-size: 0.8rem;
            font-weight: 600;
            color: var(--primary);
            background: #eff6ff;
            padding: 0.35rem 0.9rem;
            border-radius: 999px;
            display: inline-block;
            margin-bottom: 0.8rem;
        }

        .form-group { margin-bottom: 1.2rem; }

        label {
            display: block;
            margin-bottom: 0.4rem;
            font-size: 0.9rem; 
            font-weight: 600; 
            color: #334155;
            text-align: left;
        }

        .input-wrap { position: relative; width: 100%; }

        .input-wrap i.icon-left {
            position: absolute;
            left: 1rem;
            top: 50%;
            transform: translateY(-50%);
            color: #94a3b8;
            font-size: 1rem; 
        }
        .input-wrap.textarea-wrap i.icon-left {
            top: 1.1rem;
            transform: none;
        }

        input, select, textarea {
            width: 100%;
            background: #f8fafc;
            border: 1px solid var(--border-light);
            border-radius: var(--radius-sm);
            padding: 0.8rem 1rem 0.8rem 2.6rem; 
            font-size: 0.95rem; 
            color: var(--text-main);
            transition: all 0.2s ease;
        }
        
        textarea { resize: vertical; min-height: 80px; padding-top: 1rem; }
        input[type="file"] { padding: 0.6rem 1rem 0.6rem 2.6rem; }
        
        input[type="file"]::file-selector-button {
            border: none;
            background: #e2e8f0;
            padding: 0.4rem 0.8rem;
            border-radius: 6px;
            margin-right: 0.8rem;
            font-weight: 600;
            color: #475569;
            font-size: 0.85rem;
            cursor: pointer;
            transition: 0.2s;
        }
        input[type="file"]::file-selector-button:hover { background: #cbd5e1; }

        input::placeholder, textarea::placeholder { color: #94a3b8; font-weight: 400;}
        input:focus, select:focus, textarea:focus {
            background: #ffffff;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px var(--border-focus); 
        }

        input:focus + i.icon-left, 
        select:focus + i.icon-left,
        textarea:focus + i.icon-left,
        .input-wrap:focus-within i.icon-left {
            color: var(--primary);
        }

        .toggle-password {
            position: absolute;
            right: 1rem;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            color: #94a3b8;
            cursor: pointer;
            font-size: 1rem;
            padding: 0.2rem;
        }
        .toggle-password:hover { color: var(--text-main); }

        .terms-wrap {
            display: flex;
            align-items: flex-start;
            gap: 0.6rem;
            margin-bottom: 1.5rem;
            font-size: 0.9rem;
            color: var(--text-muted);
            line-height: 1.4;
            text-align: left;
        }
        .terms-wrap input[type="checkbox"] {
            width: 1rem;
            height: 1rem;
            margin-top: 0.15rem; 
            accent-color: var(--primary);
            cursor: pointer;
        }
        .terms-wrap a { color: var(--primary); font-weight: 600; }
        
        .btn-group {
            display: flex;
            gap: 0.8rem;
            margin-top: 1rem;
        }

        .btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            width: 100%;
            padding: 0.8rem 1rem; 
            border-radius: var(--radius-sm);
            font-weight: 600;
            font-size: 1rem; 
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn-primary { background: var(--primary); color: #fff; }
        .btn-primary:hover:not(:disabled) { background: var(--primary-dark); transform: translateY(-1px); }
        .btn-outline { background: #fff; border: 1px solid #cbd5e1; color: var(--text-main); }
        .btn-outline:hover { background: var(--bg-body); border-color: #94a3b8; }
        .btn:disabled { opacity: 0.7; cursor: not-allowed; transform: none; }

        #auth-message {
            margin-top: 1rem;
            padding: 0.8rem;
            border-radius: var(--radius-sm);
            font-size: 0.9rem;
            display: none;
            text-align: center;
            font-weight: 500;
        }
        #auth-message.error {
            display: block;
            background: #fef2f2;
            color: #b91c1c;
            border: 1px solid #fecaca;
        }

        .alt-in-card {
            margin-top: 1.5rem;
            text-align: center;
            color: var(--text-muted);
            font-size: 0.9rem;
            border-top: 1px solid var(--border-light);
            padding-top: 1.2rem;
        }
        .alt-in-card a { color: var(--primary); font-weight: 700; }
        .alt-in-card a:hover { text-decoration: underline; color: var(--primary-dark); }
        
        .row-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; text-align: left; }

        .logo-preview-box {
            display: none;
            margin-top: 0.8rem;
            text-align: center;
            padding: 0.5rem;
            background: var(--bg-body);
            border-radius: var(--radius-sm);
            border: 1px dashed #cbd5e1;
        }
        .logo-preview-box img {
            max-width: 60px;
            max-height: 60px;
            border-radius: 6px;
            object-fit: cover;
        }

        /* --- CUSTOM SEARCHABLE DROPDOWN --- */
        .phone-group { display: flex; gap: 0.5rem; }
        
        .custom-select-wrapper {
            position: relative;
            width: 120px; 
            flex-shrink: 0;
        }
        .custom-select-trigger {
            display: flex;
            justify-content: space-between;
            align-items: center;
            height: 100%;
            background: #f8fafc;
            border: 1px solid var(--border-light);
            border-radius: var(--radius-sm);
            padding: 0 0.8rem;
            font-size: 0.95rem;
