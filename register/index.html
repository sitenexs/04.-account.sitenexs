<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Daftar - Sitenexs</title>
    <meta name="description" content="Halaman pendaftaran akun Sitenexs." />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary: #2563eb;
            --primary-dark: #1d4ed8;
            --primary-light: #eff6ff;
            --accent: #10b981;
            --bg-body: #f8fafc;
            --bg-card: #ffffff;
            --text-main: #0f172a;
            --text-muted: #475569;
            --border-subtle: #e2e8f0;
            --border-medium: #cbd5e1;
            --shadow-md: 0 12px 30px -12px rgba(15,23,42,0.18);
            --radius-md: 0.75rem;
            --radius-lg: 1rem;
            --radius-xl: 1.5rem;
        }

        * { box-sizing: border-box; }
        body {
            margin: 0;
            font-family: 'Plus Jakarta Sans', sans-serif;
            background: linear-gradient(135deg, #eef7ff 0%, #f8fafc 100%);
            color: var(--text-main);
        }

        a { text-decoration: none; color: inherit; }
        button, input, select { font: inherit; }

        .container {
            width: min(1100px, calc(100% - 2rem));
            margin: 0 auto;
        }

        .topbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            height: 72px;
        }

        .brand {
            display: inline-flex;
            align-items: center;
            gap: 0.75rem;
            font-weight: 800;
            font-size: 1.2rem;
            color: var(--text-main);
        }

        .brand-mark {
            width: 38px;
            height: 38px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid rgba(37,99,235,0.2);
            background: #fff;
        }

        .brand-text {
            background: linear-gradient(135deg, #1e40af 0%, #3b82f6 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .back-link {
            color: var(--primary);
            font-weight: 700;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
        }

        .auth-wrap {
            min-height: calc(100vh - 72px);
            display: grid;
            place-items: center;
            padding: 2rem 0 4rem;
        }

        .card {
            width: min(100%, 560px);
            background: rgba(255,255,255,0.95);
            border: 1px solid var(--border-subtle);
            box-shadow: var(--shadow-md);
            border-radius: var(--radius-xl);
            padding: 2rem 1.5rem;
        }

        .eyebrow {
            display: inline-block;
            background: var(--primary-light);
            color: var(--primary);
            padding: 0.35rem 0.8rem;
            border-radius: 999px;
            font-size: 0.72rem;
            font-weight: 800;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            margin-bottom: 1rem;
        }

        h1 {
            font-size: clamp(1.8rem, 4vw, 2.3rem);
            margin: 0 0 0.5rem;
            letter-spacing: -0.03em;
        }

        .subtext {
            color: var(--text-muted);
            margin: 0 0 1.5rem;
            font-size: 0.96rem;
            line-height: 1.6;
        }

        .grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1rem;
        }

        .form-group {
            margin-bottom: 1rem;
        }

        label {
            display: block;
            margin-bottom: 0.45rem;
            font-size: 0.85rem;
            font-weight: 700;
            color: var(--text-main);
        }

        .input-wrap {
            position: relative;
        }

        .input-wrap i {
            position: absolute;
            left: 0.9rem;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
            font-size: 0.9rem;
        }

        input, select {
            width: 100%;
            border: 1px solid var(--border-medium);
            background: #f8fafc;
            border-radius: var(--radius-md);
            padding: 0.85rem 1rem 0.85rem 2.5rem;
            transition: 0.2s ease;
            color: var(--text-main);
        }

        input:focus, select:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.1);
            background: #fff;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            width: 100%;
            padding: 0.9rem 1.25rem;
            border: 1px solid transparent;
            border-radius: var(--radius-md);
            font-weight: 800;
            cursor: pointer;
            transition: 0.2s ease;
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
            color: #fff;
            box-shadow: 0 8px 18px rgba(37,99,235,0.2);
        }

        .btn-primary:hover { transform: translateY(-2px); }

        .alt {
            margin-top: 1.2rem;
            text-align: center;
            color: var(--text-muted);
            font-size: 0.9rem;
        }

        .alt a {
            color: var(--primary);
            font-weight: 800;
        }

        @media (max-width: 600px) {
            .grid { grid-template-columns: 1fr; }
            .card { padding: 1.25rem 1rem; }
            .topbar { height: 64px; }
        }
    </style>
</head>
<body>
    <header class="container topbar">
        <a href="https://sitenexs.com/" class="brand" aria-label="Ke halaman utama Sitenexs">
            <img src="https://sitenexs.com/assets/logo/logo.png" alt="Sitenexs Logo" class="brand-mark" onerror="this.onerror=null; this.src='https://ui-avatars.com/api/?name=Sitenexs&background=2563eb&color=fff&size=64&rounded=true';">
            <span class="brand-text">Sitenexs</span>
        </a>
        <a href="https://sitenexs.com/" class="back-link"><i class="fas fa-arrow-left"></i> Kembali</a>
    </header>

    <main class="auth-wrap">
        <section class="card">
            <div class="eyebrow">Bergabung</div>
            <h1>Daftar</h1>
            <p class="subtext">Pendaftaran bersifat opsional. Anda tetap bisa menjelajahi situs tanpa membuat akun.</p>

            <form id="register-form">
                <div class="form-group">
                    <label for="nama">Nama Lengkap</label>
                    <div class="input-wrap">
                        <i class="fas fa-user"></i>
                        <input id="nama" type="text" autocomplete="name" placeholder="Nama Anda" required>
                    </div>
                </div>

                <div class="form-group">
                    <label for="email">Email</label>
                    <div class="input-wrap">
                        <i class="fas fa-envelope"></i>
                        <input id="email" type="email" autocomplete="email" placeholder="email@contoh.com" required>
                    </div>
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <div class="input-wrap">
                        <i class="fas fa-lock"></i>
                        <input id="password" type="password" autocomplete="new-password" minlength="6" placeholder="Minimal 6 karakter" required>
                    </div>
                </div>

                <button type="submit" class="btn btn-primary">Buat Akun</button>
            </form>

            <p id="auth-message" role="status" aria-live="polite" style="margin-top:1rem;color:var(--text-muted);"></p>

            <div class="alt">
                Sudah punya akun? <a href="https://account.sitenexs.com/sign-in/">Masuk di sini</a>
            </div>
        </section>
    </main>
    <script type="module">
        import { initializeApp } from 'https://www.gstatic.com/firebasejs/13.1.0/firebase-app.js';
        import { getAuth, createUserWithEmailAndPassword, updateProfile } from 'https://www.gstatic.com/firebasejs/13.1.0/firebase-auth.js';

        const firebaseConfig = {
            apiKey: 'AIzaSyDuN4zlRaSnmcUSuXE_E84IE7d3Mz8E-N4',
            authDomain: 'sitenexs-62919.firebaseapp.com',
            projectId: 'sitenexs-62919',
            storageBucket: 'sitenexs-62919.firebasestorage.app',
            messagingSenderId: '1060348110644',
            appId: '1:1060348110644:web:e45af14d5f26a9cf8e6761',
            measurementId: 'G-C7YL0Q7YRQ'
        };

        const auth = getAuth(initializeApp(firebaseConfig));
        const form = document.getElementById('register-form');
        const message = document.getElementById('auth-message');
        const submitButton = form.querySelector('button[type="submit"]');

        form.addEventListener('submit', async (event) => {
            event.preventDefault();
            message.textContent = '';
            submitButton.disabled = true;

            try {
                const credential = await createUserWithEmailAndPassword(
                    auth,
                    document.getElementById('email').value.trim(),
                    document.getElementById('password').value
                );
                await updateProfile(credential.user, {
                    displayName: document.getElementById('nama').value.trim()
                });
                window.location.assign('/profile/');
            } catch (error) {
                const messages = {
                    'auth/email-already-in-use': 'Email ini sudah terdaftar. Silakan masuk.',
                    'auth/invalid-email': 'Masukkan alamat email yang valid.',
                    'auth/weak-password': 'Password terlalu lemah. Gunakan minimal 6 karakter.',
                    'auth/network-request-failed': 'Koneksi bermasalah. Periksa internet Anda.'
                };
                message.textContent = messages[error.code] || 'Pendaftaran gagal. Silakan coba lagi.';
                console.error('Firebase registration failed:', error);
            } finally {
                submitButton.disabled = false;
            }
        });
    </script>
</body>
</html>
