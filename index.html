    <style>
        /* === CSS VARIABLES (Sama dengan Landing Page) === */
        :root {
            --primary: #2563eb;
            --primary-dark: #1d4ed8;
            --primary-light: #eff6ff;
            --accent: #10b981;
            --bg-body: #f8fafc;
            --bg-card: #ffffff;
            --text-main: #0f172a;
            --text-muted: #475569;
            
            --border-subtle: #cbd5e1;
            --border-medium: #94a3b8;
            --border-accent: #3b82f6;
            
            --shadow-sm: 0 1px 2px 0 rgba(15, 23, 42, 0.05);
            --shadow-md: 0 4px 6px -1px rgba(15, 23, 42, 0.08), 0 2px 4px -2px rgba(15, 23, 42, 0.05);
            --shadow-xl: 0 20px 25px -5px rgba(15, 23, 42, 0.12), 0 8px 10px -6px rgba(15, 23, 42, 0.08);
            
            --radius-md: 0.35rem;
            --radius-lg: 0.75rem;
            --radius-full: 9999px;
            --transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
        }

        /* === RESET & BASE === */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: var(--bg-body);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
        }

        a {
            text-decoration: none;
            color: var(--primary);
            font-weight: 600;
        }
        a:hover {
            text-decoration: underline;
        }

        /* === AUTH CONTAINER === */
        .auth-wrapper {
            width: 100%;
            max-width: 420px;
        }

        .auth-card {
            background-color: var(--bg-card);
            border: 1px solid var(--border-subtle);
            border-radius: var(--radius-lg);
            padding: 2rem;
            box-shadow: var(--shadow-xl);
        }

        .auth-header {
            text-align: center;
            margin-bottom: 1.75rem;
        }

        .logo {
            display: inline-flex;
            align-items: center;
            gap: 0.4rem;
            font-weight: 800;
            font-size: 1.25rem;
            color: var(--text-main);
            margin-bottom: 1rem;
        }

        .logo-text {
            background: linear-gradient(135deg, #1e40af 0%, #3b82f6 50%, #60a5fa 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .logo-img {
            height: 32px;
            width: auto;
            border: 1px solid var(--border-subtle);
            border-radius: var(--radius-full);
            padding: 2px;
            object-fit: contain;
        }

        .auth-title {
            font-size: 1.35rem;
            font-weight: 800;
            letter-spacing: -0.02em;
            color: var(--text-main);
        }

        .auth-desc {
            font-size: 0.8rem;
            color: var(--text-muted);
            margin-top: 0.3rem;
        }

        /* === FORM ELEMENTS === */
        .form-group {
            margin-bottom: 1rem;
        }

        .form-group label {
            display: block;
            font-size: 0.78rem;
            font-weight: 700;
            margin-bottom: 0.35rem;
            color: var(--text-main);
        }

        .input-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }

        .form-control {
            width: 100%;
            padding: 0.65rem 0.75rem 0.65rem 2.35rem;
            border-radius: var(--radius-md);
            border: 1px solid var(--border-subtle);
            background-color: #ffffff;
            font-size: 0.825rem;
            color: var(--text-main);
            transition: var(--transition);
        }

        .input-icon {
            position: absolute;
            left: 0.75rem;
            color: var(--text-muted);
            font-size: 0.85rem;
        }

        .password-toggle {
            position: absolute;
            right: 0.75rem;
            background: none;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            font-size: 0.85rem;
        }
        .password-toggle:hover {
            color: var(--text-main);
        }

        .form-control:hover {
            border-color: var(--border-medium);
        }

        .form-control:focus {
            outline: none;
            border-color: var(--border-accent);
            box-shadow: 0 0 0 2px rgba(37, 99, 235, 0.15);
        }

        .auth-options {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.78rem;
            margin-bottom: 1.25rem;
        }

        .remember-me {
            display: flex;
            align-items: center;
            gap: 0.4rem;
            color: var(--text-muted);
            cursor: pointer;
        }

        /* Button */
        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.4rem;
            padding: 0.65rem 1.25rem;
            font-size: 0.85rem;
            font-weight: 600;
            border-radius: var(--radius-full);
            transition: var(--transition);
            cursor: pointer;
            border: 1px solid transparent;
            text-align: center;
            width: 100%;
        }

        .btn-primary {
            background-color: var(--primary);
            color: #ffffff;
            border-color: var(--primary-dark);
            box-shadow: 0 2px 6px rgba(37, 99, 235, 0.2);
            border-radius: var(--radius-md);
        }

        .btn-primary:hover {
            background-color: var(--primary-dark);
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(37, 99, 235, 0.3);
        }

        .auth-footer {
            text-align: center;
            margin-top: 1.5rem;
            font-size: 0.78rem;
            color: var(--text-muted);
        }

        .back-home {
            display: block;
            text-align: center;
            margin-top: 1rem;
            font-size: 0.78rem;
            color: var(--text-muted);
        }
        .back-home:hover {
            color: var(--primary);
            text-decoration: none;
        }
    </style>
</head>
<body>

    <div class="auth-wrapper">
        <div class="auth-card">
            <div class="auth-header">
                <a href="index.html" class="logo">
                    <img src="https://sitenexs.com/assets/logo/logo.png" alt="Sitenexs Logo" class="logo-img" onerror="this.style.display='none'">
                    <span class="logo-text">Sitenexs</span>
                </a>
                <h1 class="auth-title">Selamat Datang Kembali</h1>
                <p class="auth-desc">Masuk ke akun dashboard usaha Anda</p>
            </div>

            <form id="login-form">
                <div class="form-group">
                    <label>Email / No. WhatsApp</label>
                    <div class="input-wrapper">
                        <i class="fas fa-envelope input-icon"></i>
                        <input type="text" required placeholder="nama@email.com atau 085xxxxx" class="form-control">
                    </div>
                </div>

                <div class="form-group">
                    <label>Kata Sandi (Password)</label>
                    <div class="input-wrapper">
                        <i class="fas fa-lock input-icon"></i>
                        <input type="password" id="password-input" required placeholder="••••••••" class="form-control" style="padding-right: 2.35rem;">
                        <button type="button" id="toggle-password" class="password-toggle" aria-label="Tampilkan Password">
                            <i class="fas fa-eye" id="eye-icon"></i>
                        </button>
                    </div>
                </div>

                <div class="auth-options">
                    <label class="remember-me">
                        <input type="checkbox"> Ingat saya
                    </label>
                    <a href="#">Lupa sandi?</a>
                </div>

                <button type="submit" class="btn btn-primary">
                    <i class="fas fa-arrow-right-to-bracket"></i> Masuk Dashboard
                </button>
            </form>

            <div class="auth-footer">
                Belum punya akun Sitenexs? <a href="https://account.sitenexs.com/register">Daftar sekarang</a>
            </div>
        </div>

        <a href="https://sitenexs.com" class="back-home">
            <i class="fas fa-arrow-left"></i> Kembali ke Beranda Utama
        </a>
    </div>

    <script type="application/ld+json">

      "@context": "https://schema.org",

      }
    }

    <script>
        // Fitur Lihat / Sembunyikan Password
        const togglePasswordBtn = document.getElementById('toggle-password');
        const passwordInput = document.getElementById('password-input');
        const eyeIcon = document.getElementById('eye-icon');

        togglePasswordBtn.addEventListener('click', () => {
            const isPassword = passwordInput.type === 'password';
            passwordInput.type = isPassword ? 'text' : 'password';
            eyeIcon.classList.toggle('fa-eye', !isPassword);
            eyeIcon.classList.toggle('fa-eye-slash', isPassword);
        });

        // Simulasi Aksi Login
        document.getElementById('login-form').addEventListener('submit', (e) => {
            e.preventDefault();
            alert('login berhasil! Mengarahkan ke dashboard...');
            window.location.href = 'https://sitenexs.com'; // Arahkan ke halaman dashboard jika sudah ada
        });
    </script>
