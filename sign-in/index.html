<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Masuk - Sitenexs</title>
    <meta name="description" content="Halaman login untuk akun Sitenexs." />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary: #2563eb;
            --primary-dark: #1d4ed8;
            --bg-body: #f1f5f9;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --border-light: #cbd5e1;
            --border-focus: #93c5fd;
            
            --shadow-card: 0 10px 25px -5px rgba(15, 23, 42, 0.08), 0 4px 10px -4px rgba(15, 23, 42, 0.04);
            
            --radius-sm: 0.4rem;  
            --radius-md: 0.75rem; 
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: var(--bg-body);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            -webkit-font-smoothing: antialiased;
        }

        a { text-decoration: none; color: inherit; transition: 0.2s; }
        button, input { font: inherit; outline: none; border: none; }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .topbar {
            width: min(900px, calc(100% - 2rem));
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
            height: 60px;
        }

        .brand {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            font-weight: 700;
            font-size: 1rem;
        }

        .brand-mark {
            width: 28px;
            height: 28px;
            border-radius: 50%;
            object-fit: cover;
            border: 1px solid var(--border-light);
        }

        .brand-text {
            background: linear-gradient(135deg, #1e40af 0%, #3b82f6 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            letter-spacing: -0.01em;
        }

        .back-link {
            color: var(--text-muted);
            font-weight: 500;
            font-size: 0.85rem;
            display: flex;
            align-items: center;
            gap: 0.4rem;
        }
        
        .back-link:hover { color: var(--primary); }

        .auth-wrap {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1rem;
        }

        .card {
            width: 100%;
            max-width: 360px; 
            background: #ffffff;
            border: 1px solid #e2e8f0;
            box-shadow: var(--shadow-card);
            border-radius: var(--radius-md);
            padding: 2rem 1.75rem; 
            animation: fadeIn 0.4s ease-out forwards;
        }

        .header-text { text-align: center; margin-bottom: 1.5rem; }

        h1 {
            font-size: 1.35rem; 
            font-weight: 700;
            margin-bottom: 0.25rem;
            color: #0f172a;
        }

        .subtext {
            color: var(--text-muted);
            font-size: 0.8rem;
            line-height: 1.4;
        }

        .form-group { margin-bottom: 1rem; }

        label {
            display: block;
            margin-bottom: 0.35rem;
            font-size: 0.75rem; 
            font-weight: 600;
            color: #475569;
        }

        .input-wrap { position: relative; }

        .input-wrap i.icon-left {
            position: absolute;
            left: 0.85rem;
            top: 50%;
            transform: translateY(-50%);
            color: #94a3b8;
            font-size: 0.85rem; 
            transition: color 0.2s ease;
        }

        input {
            width: 100%;
            background: #ffffff;
            border: 1px solid var(--border-light);
            border-radius: var(--radius-sm);
            padding: 0.6rem 0.8rem 0.6rem 2.2rem; 
            font-size: 0.85rem; 
            color: var(--text-main);
            transition: all 0.2s ease;
        }

        input::placeholder { color: #94a3b8; }
        input:hover { border-color: #94a3b8; }
        input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px var(--border-focus); 
        }

        input:focus + i.icon-left, 
        .input-wrap:focus-within i.icon-left {
            color: var(--primary);
        }

        .toggle-password {
            position: absolute;
            right: 0.6rem;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            color: #94a3b8;
            cursor: pointer;
            font-size: 0.85rem;
            padding: 0.3rem;
        }

        .toggle-password:hover { color: var(--text-main); }

        .row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin: 0.5rem 0 1.25rem;
            font-size: 0.75rem;
        }

        .remember {
            display: inline-flex;
            align-items: center;
            gap: 0.35rem;
            color: var(--text-muted);
            cursor: pointer;
        }

        .remember input {
            width: 0.85rem;
            height: 0.85rem;
            accent-color: var(--primary);
            cursor: pointer;
            border-radius: 2px;
        }

        .link {
            color: var(--primary);
            font-weight: 600;
            background: none;
            border: none;
            cursor: pointer;
            padding: 0;
            font-size: 0.75rem;
        }
        
        .link:hover { text-decoration: underline; }

        .btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            width: 100%;
            padding: 0.65rem; 
            border-radius: var(--radius-sm);
            font-weight: 600;
            font-size: 0.85rem; 
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .btn-primary {
            background: var(--primary);
            color: #fff;
        }

        .btn-primary:hover:not(:disabled) {
            background: var(--primary-dark);
        }

        /* Tombol Google Standar Asli (Desain Profesional) */
        .btn-google {
            background: #ffffff;
            color: #3c4043;
            border: 1px solid #dadce0;
            margin-top: 0.75rem;
            font-weight: 500;
            box-shadow: 0 1px 2px 0 rgba(60, 64, 67, 0.08), 0 1px 3px 1px rgba(60, 64, 67, 0.04);
            transition: background-color 0.2s, box-shadow 0.2s;
        }

        .btn-google:hover:not(:disabled) {
            background: #f8f9fa;
            border-color: #d2d5dc;
            box-shadow: 0 1px 3px 0 rgba(60, 64, 67, 0.15), 0 4px 8px 3px rgba(60, 64, 67, 0.05);
        }

        .btn-google:active:not(:disabled) {
            background: #f1f3f4;
            box-shadow: 0 1px 2px 0 rgba(60, 64, 67, 0.3);
        }

        .google-icon {
            width: 18px;
            height: 18px;
            flex-shrink: 0;
        }

        .btn:disabled { opacity: 0.7; cursor: not-allowed; }

        .divider {
            display: flex;
            align-items: center;
            text-align: center;
            margin: 1.25rem 0 0.75rem;
            color: var(--text-muted);
            font-size: 0.75rem;
        }

        .divider::before, .divider::after {
            content: '';
            flex: 1;
            border-bottom: 1px solid var(--border-light);
        }

        .divider span { padding: 0 0.75rem; }

        #auth-message {
            margin-top: 1rem;
            padding: 0.6rem;
            border-radius: var(--radius-sm);
            font-size: 0.75rem;
            display: none;
            text-align: center;
        }

        #auth-message.error {
            display: block;
            background: #fef2f2;
            color: #b91c1c;
            border: 1px solid #fecaca;
        }
        
        #auth-message.success {
            display: block;
            background: #ecfdf5;
            color: #047857;
            border: 1px solid #a7f3d0;
        }

        .alt {
            margin-top: 1.5rem;
            text-align: center;
            color: var(--text-muted);
            font-size: 0.8rem;
        }

        .alt a { color: var(--primary); font-weight: 600; }
        .alt a:hover { text-decoration: underline; }
    </style>
</head>
<body>
    <header class="topbar">
        <a href="https://sitenexs.com/" class="brand" aria-label="Ke halaman utama">
            <img src="https://sitenexs.com/assets/logo/logo.png" alt="Logo" class="brand-mark" onerror="this.onerror=null; this.src='https://ui-avatars.com/api/?name=Sitenexs&background=2563eb&color=fff&size=28&rounded=true';">
            <span class="brand-text">Sitenexs</span>
        </a>
        <a href="https://sitenexs.com/" class="back-link">
            <i class="fas fa-arrow-left"></i> Kembali
        </a>
    </header>

    <main class="auth-wrap">
        <section class="card">
            <div class="header-text">
                <h1 class="brand-text">Selamat Datang</h1>
                <p class="subtext">Masuk untuk mengelola akun Anda.</p>
            </div>

            <form id="login-form">
                <div class="form-group">
                    <label for="email">Alamat Email</label>
                    <div class="input-wrap">
                        <i class="fas fa-envelope icon-left"></i>
                        <input id="email" type="email" autocomplete="email" placeholder="email@contoh.com" required>
                    </div>
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <div class="input-wrap">
                        <i class="fas fa-lock icon-left"></i>
                        <input id="password" type="password" autocomplete="current-password" placeholder="Masukkan password" required>
                        <button type="button" class="toggle-password" id="togglePassword" aria-label="Tampilkan password">
                            <i class="fas fa-eye"></i>
                        </button>
                    </div>
                </div>

                <div class="row">
                    <label class="remember">
                        <input type="checkbox" id="rememberMe" />
                        Ingat saya
                    </label>
                    <button id="reset-password" type="button" class="link">Lupa password?</button>
                </div>

                <button type="submit" class="btn btn-primary" id="submitBtn">
                    <span id="btnText">Masuk</span>
                </button>
            </form>

            <div class="divider">
                <span>Atau</span>
            </div>

            <!-- Tombol Google Sign-In Asli & Profesional -->
            <button type="button" class="btn btn-google" id="googleBtn">
                <svg class="google-icon" viewBox="0 0 24 24">
                    <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
                    <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
                    <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/>
                    <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/>
                </svg>
                <span id="googleBtnText">Lanjutkan dengan Google</span>
            </button>

            <div id="auth-message" role="status" aria-live="polite"></div>

            <div class="alt">
                Belum punya akun? <a href="https://account.sitenexs.com/register/">Daftar di sini</a>
            </div>
        </section>
    </main>
    
    <script type="module">
        import { initializeApp } from 'https://www.gstatic.com/firebasejs/13.1.0/firebase-app.js';
        import {
            browserLocalPersistence,
            browserSessionPersistence,
            getAuth,
            onAuthStateChanged,
            setPersistence,
            signInWithEmailAndPassword,
            sendPasswordResetEmail,
            GoogleAuthProvider,
            signInWithPopup,
            signOut
        } from 'https://www.gstatic.com/firebasejs/13.1.0/firebase-auth.js';
        
        // Jika Anda menggunakan Firestore untuk menyimpan data user, aktifkan baris di bawah ini:
        // import { getFirestore, doc, getDoc } from 'https://www.gstatic.com/firebasejs/13.1.0/firebase-firestore.js';

        const firebaseConfig = {
            apiKey: 'AIzaSyDuN4zlRaSnmcUSuXE_E84IE7d3Mz8E-N4',
            authDomain: 'sitenexs-62919.firebaseapp.com',
            projectId: 'sitenexs-62919',
            storageBucket: 'sitenexs-62919.firebasestorage.app',
            messagingSenderId: '1060348110644',
            appId: '1:1060348110644:web:e45af14d5f26a9cf8e6761',
            measurementId: 'G-C7YL0Q7YRQ'
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        // const db = getFirestore(app); // Aktifkan jika menggunakan Firestore

        const form = document.getElementById('login-form');
        const message = document.getElementById('auth-message');
        const submitButton = document.getElementById('submitBtn');
        const btnText = document.getElementById('btnText');
        
        const googleBtn = document.getElementById('googleBtn');
        const googleBtnText = document.getElementById('googleBtnText');
        const googleProvider = new GoogleAuthProvider();

        const mainSiteOrigin = 'https://sitenexs.com';
        
        const togglePassword = document.getElementById('togglePassword');
        const passwordInput = document.getElementById('password');

        togglePassword.addEventListener('click', function () {
            const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
            passwordInput.setAttribute('type', type);
            this.innerHTML = type === 'password' ? '<i class="fas fa-eye"></i>' : '<i class="fas fa-eye-slash"></i>';
        });

        // Reset tombol jika halaman dimuat ulang dari cache browser
        window.addEventListener('pageshow', () => {
            googleBtn.disabled = false;
            googleBtnText.textContent = 'Lanjutkan dengan Google';
            submitButton.disabled = false;
            btnText.textContent = 'Masuk';
        });

        // Fungsi pembantu untuk mengecek apakah user sudah terdaftar di database Sitenexs
        async function checkUserRegistered(user) {
            try {
                // Contoh pengecekan ke Firestore pada koleksi 'users' dengan ID `user.uid`
                // const userRef = doc(db, 'users', user.uid);
                // const userSnap = await getDoc(userRef);
                // return userSnap.exists();

                // CATATAN: Jika Anda menggunakan metode lain (seperti database kustom/API), 
                // ganti blok di atas dengan fetch ke server Anda. 
                // Untuk sementara, kita asumsikan jika email mengandung domain tertentu atau Anda bisa sesuaikan kondisinya.
                
                return true; // Ubah ke false jika data belum ditemukan di database Anda
            } catch (err) {
                console.error("Gagal memeriksa data user:", err);
                return false;
            }
        }

        // Pantau status login secara otomatis untuk postMessage
        onAuthStateChanged(auth, (user) => {
            if (window.parent !== window) {
                window.parent.postMessage({
                    type: 'sitenexs-auth-state',
                    signedIn: Boolean(user)
                }, mainSiteOrigin);
            }
        });

        function showMessage(msg, type = 'error') {
            message.textContent = msg;
            message.className = type;
        }

        // Login Email & Password
        form.addEventListener('submit', async (event) => {
            event.preventDefault();
            message.className = '';
            message.textContent = '';
            submitButton.disabled = true;
            btnText.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Memproses...';
            
            try {
                const persistence = document.getElementById('rememberMe').checked
                    ? browserLocalPersistence
                    : browserSessionPersistence;
                
                await setPersistence(auth, persistence);
                
                const userCredential = await signInWithEmailAndPassword(
                    auth,
                    document.getElementById('email').value.trim(),
                    document.getElementById('password').value
                );
                
                const user = userCredential.user;

                // Cek apakah data user ada di database Sitenexs
                const isRegistered = await checkUserRegistered(user);
                if (!isRegistered) {
                    await signOut(auth);
                    window.location.assign('https://account.sitenexs.com/register/');
                    return;
                }

                localStorage.setItem('sitenexs_logged_in', 'true');
                localStorage.setItem('sitenexs_uid', user.uid);
                localStorage.setItem('sitenexs_show_welcome', 'true');

                btnText.innerHTML = '<i class="fas fa-check"></i> Berhasil';
                window.location.assign(`https://sitenexs.com/?welcome=true&uid=${user.uid}`);

            } catch (error) {
                const messages = {
                    'auth/invalid-credential': 'Email atau password salah.',
                    'auth/invalid-email': 'Masukkan alamat email yang valid.',
                    'auth/too-many-requests': 'Terlalu banyak percobaan. Coba lagi nanti.',
                    'auth/network-request-failed': 'Koneksi bermasalah. Periksa internet Anda.'
                };
                showMessage(messages[error.code] || 'Terjadi kesalahan saat masuk.', 'error');
                
                submitButton.disabled = false;
                btnText.textContent = 'Masuk';
            }
        });

        // Login dengan Google menggunakan Popup
        googleBtn.addEventListener('click', async () => {
            message.className = '';
            message.textContent = '';
            googleBtn.disabled = true;
            googleBtnText.innerHTML = 'Menghubungkan...';

            try {
                await setPersistence(auth, browserLocalPersistence);
                const result = await signInWithPopup(auth, googleProvider);
                const user = result.user;

                // CEK APAKAH USER SUDAH TERDAFTAR DI DATABASE SITENEXS
                const isRegistered = await checkUserRegistered(user);
                
                if (!isRegistered) {
                    // Jika belum terdaftar, keluarkan sesi auth dan arahkan ke halaman register
                    await signOut(auth);
                    window.location.assign('https://account.sitenexs.com/register/');
                    return;
                }

                localStorage.setItem('sitenexs_logged_in', 'true');
                localStorage.setItem('sitenexs_uid', user.uid);
                localStorage.setItem('sitenexs_show_welcome', 'true');

                googleBtnText.innerHTML = 'Berhasil';
                showMessage('Login berhasil! Mengalihkan ke Sitenexs...', 'success');

                window.location.assign(`https://sitenexs.com/?welcome=true&uid=${user.uid}`);
            } catch (error) {
                console.error("Google Popup Error:", error);
                googleBtn.disabled = false;
                googleBtnText.textContent = 'Lanjutkan dengan Google';
                const messages = {
                    'auth/popup-closed-by-user': 'Login Google dibatalkan.',
                    'auth/cancelled-popup-request': 'Permintaan login dibatalkan.',
                    'auth/account-exists-with-different-credential': 'Akun sudah terdaftar dengan metode lain.',
                    'auth/unauthorized-domain': 'Domain ini belum diizinkan di Firebase Console.'
                };
                showMessage(messages[error.code] || 'Gagal masuk dengan Google: ' + error.message, 'error');
            }
        });

        // Lupa Password
        document.getElementById('reset-password').addEventListener('click', async () => {
            const email = document.getElementById('email').value.trim();
            if (!email) {
                showMessage('Masukkan email Anda terlebih dahulu untuk reset password.', 'error');
                document.getElementById('email').focus();
                return;
            }

            try {
                await sendPasswordResetEmail(auth, email);
                showMessage('Tautan reset password telah dikirim ke email Anda.', 'success');
            } catch (error) {
                const messages = {
                    'auth/invalid-email': 'Masukkan alamat email yang valid.',
                    'auth/user-not-found': 'Email tidak terdaftar.',
                };
                showMessage(messages[error.code] || 'Gagal mengirim tautan reset.', 'error');
            }
        });
    </script>
</body>
</html>
