<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Masuk - Sitenexs</title>
    <meta name="description" content="Halaman login untuk akun Sitenexs." />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary: #2563eb;
            --primary-dark: #1d4ed8;
            --primary-light: #eff6ff;
            --accent: #10b981;
            --bg-body: #f8fafc;
            --bg-card: #ffffff;
            --text-main: #0f172a;
            --text-muted: #475569;
            --border-subtle: #e2e8f0;
            --border-medium: #cbd5e1;
            --shadow-md: 0 12px 30px -12px rgba(15,23,42,0.18);
            --radius-md: 0.75rem;
            --radius-lg: 1rem;
            --radius-xl: 1.5rem;
        }

        * { box-sizing: border-box; }
        body {
            margin: 0;
            font-family: 'Plus Jakarta Sans', sans-serif;
            background: linear-gradient(135deg, #eff6ff 0%, #f8fafc 100%);
            color: var(--text-main);
        }

        a { text-decoration: none; color: inherit; }
        button, input { font: inherit; }

        .container {
            width: min(1100px, calc(100% - 2rem));
            margin: 0 auto;
        }

        .topbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            height: 72px;
        }

        .brand {
            display: inline-flex;
            align-items: center;
            gap: 0.75rem;
            font-weight: 800;
            font-size: 1.2rem;
            color: var(--text-main);
        }

        .brand-mark {
            width: 38px;
            height: 38px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid rgba(37,99,235,0.2);
            background: #fff;
        }

        .brand-text {
            background: linear-gradient(135deg, #1e40af 0%, #3b82f6 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .back-link {
            color: var(--primary);
            font-weight: 700;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
        }

        .auth-wrap {
            min-height: calc(100vh - 72px);
            display: grid;
            place-items: center;
            padding: 2rem 0 4rem;
        }

        .card {
            width: min(100%, 440px);
            background: rgba(255,255,255,0.95);
            border: 1px solid var(--border-subtle);
            box-shadow: var(--shadow-md);
            border-radius: var(--radius-xl);
            padding: 2rem 1.5rem;
        }

        .eyebrow {
            display: inline-block;
            background: var(--primary-light);
            color: var(--primary);
            padding: 0.35rem 0.8rem;
            border-radius: 999px;
            font-size: 0.72rem;
            font-weight: 800;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            margin-bottom: 1rem;
        }

        h1 {
            font-size: clamp(1.8rem, 4vw, 2.3rem);
            margin: 0 0 0.5rem;
            letter-spacing: -0.03em;
        }

        .subtext {
            color: var(--text-muted);
            margin: 0 0 1.5rem;
            font-size: 0.96rem;
            line-height: 1.6;
        }

        .form-group {
            margin-bottom: 1rem;
        }

        label {
            display: block;
            margin-bottom: 0.45rem;
            font-size: 0.85rem;
            font-weight: 700;
            color: var(--text-main);
        }

        .input-wrap {
            position: relative;
        }

        .input-wrap i {
            position: absolute;
            left: 0.9rem;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
            font-size: 0.9rem;
        }

        input {
            width: 100%;
            border: 1px solid var(--border-medium);
            background: #f8fafc;
            border-radius: var(--radius-md);
            padding: 0.85rem 1rem 0.85rem 2.5rem;
            transition: 0.2s ease;
            color: var(--text-main);
        }

        input:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.1);
            background: #fff;
        }

        .row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 1rem;
            margin: 0.5rem 0 1.2rem;
            font-size: 0.82rem;
            color: var(--text-muted);
        }

        .remember {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
        }

        .remember input {
            width: auto;
            accent-color: var(--primary);
        }

        .link {
            color: var(--primary);
            font-weight: 700;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            width: 100%;
            padding: 0.9rem 1.25rem;
            border: 1px solid transparent;
            border-radius: var(--radius-md);
            font-weight: 800;
            cursor: pointer;
            transition: 0.2s ease;
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
            color: #fff;
            box-shadow: 0 8px 18px rgba(37,99,235,0.2);
        }

        .btn-primary:hover { transform: translateY(-2px); }

        .alt {
            margin-top: 1.2rem;
            text-align: center;
            color: var(--text-muted);
            font-size: 0.9rem;
        }

        .alt a {
            color: var(--primary);
            font-weight: 800;
        }

        @media (max-width: 520px) {
            .card { padding: 1.25rem 1rem; }
            .topbar { height: 64px; }
        }
    </style>
</head>
<body>
    <header class="container topbar">
        <a href="https://sitenexs.com/" class="brand" aria-label="Ke halaman utama Sitenexs">
            <img src="https://sitenexs.com/assets/logo/logo.png" alt="Sitenexs Logo" class="brand-mark" onerror="this.onerror=null; this.src='https://ui-avatars.com/api/?name=Sitenexs&background=2563eb&color=fff&size=64&rounded=true';">
            <span class="brand-text">Sitenexs</span>
        </a>
        <a href="https://sitenexs.com/" class="back-link"><i class="fas fa-arrow-left"></i> Kembali</a>
    </header>

    <main class="auth-wrap">
        <section class="card">
            <div class="eyebrow">Akun</div>
            <h1>Masuk</h1>
            <p class="subtext">Silakan masuk untuk mengakses profil usaha, layanan, dan data akun Anda.</p>

            <form>
                <div class="form-group">
                    <label for="email">Email</label>
                    <div class="input-wrap">
                            <i class="fas fa-envelope"></i>
                            <input id="email" type="email" autocomplete="email" placeholder="email@contoh.com" required>
                    </div>
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <div class="input-wrap">
                        <i class="fas fa-lock"></i>
                        <input id="password" type="password" autocomplete="current-password" placeholder="Masukkan password" required>
                    </div>
                </div>

                <div class="row">
                    <label class="remember">
                        <input type="checkbox" />
                        Ingat saya
                    </label>
                    <button id="reset-password" type="button" class="link" style="border:0;background:none;cursor:pointer;font:inherit;">Lupa password?</button>
                </div>

                <button type="submit" class="btn btn-primary">Masuk ke Akun</button>
            </form>

            <p id="auth-message" role="status" aria-live="polite" style="margin-top:1rem;color:var(--text-muted);"></p>

            <div class="alt">
                Belum punya akun? <a href="https://account.sitenexs.com/register/">Daftar sekarang</a>
            </div>
        </section>
    </main>
    <script type="module">
        import { initializeApp } from 'https://www.gstatic.com/firebasejs/13.1.0/firebase-app.js';
        import {
            browserLocalPersistence,
            browserSessionPersistence,
            getAuth,
            onAuthStateChanged,
            setPersistence,
            signInWithEmailAndPassword,
            sendPasswordResetEmail
        } from 'https://www.gstatic.com/firebasejs/13.1.0/firebase-auth.js';

        const firebaseConfig = {
            apiKey: 'AIzaSyDuN4zlRaSnmcUSuXE_E84IE7d3Mz8E-N4',
            authDomain: 'sitenexs-62919.firebaseapp.com',
            projectId: 'sitenexs-62919',
            storageBucket: 'sitenexs-62919.firebasestorage.app',
            messagingSenderId: '1060348110644',
            appId: '1:1060348110644:web:e45af14d5f26a9cf8e6761',
            measurementId: 'G-C7YL0Q7YRQ'
        };

        const auth = getAuth(initializeApp(firebaseConfig));
        const form = document.querySelector('form');
        const message = document.getElementById('auth-message');
        const submitButton = form.querySelector('button[type="submit"]');
        const mainSiteOrigin = 'https://sitenexs.com';

        onAuthStateChanged(auth, (user) => {
            if (window.parent !== window) {
                window.parent.postMessage({
                    type: 'sitenexs-auth-state',
                    signedIn: Boolean(user)
                }, mainSiteOrigin);
            }
        }, (error) => {
            console.error('Firebase auth state check failed:', error);
        });

        function showError(error) {
            const messages = {
                'auth/invalid-credential': 'Email atau password salah.',
                'auth/invalid-email': 'Masukkan alamat email yang valid.',
                'auth/too-many-requests': 'Terlalu banyak percobaan. Coba lagi nanti.',
                'auth/network-request-failed': 'Koneksi bermasalah. Periksa internet Anda.'
            };
            message.textContent = messages[error.code] || 'Tidak dapat memproses permintaan. Silakan coba lagi.';
            console.error('Firebase sign-in failed:', error);
        }

        form.addEventListener('submit', async (event) => {
            event.preventDefault();
            message.textContent = '';
            submitButton.disabled = true;

            try {
                const persistence = form.querySelector('input[type="checkbox"]').checked
                    ? browserLocalPersistence
                    : browserSessionPersistence;
                await setPersistence(auth, persistence);
                await signInWithEmailAndPassword(
                    auth,
                    document.getElementById('email').value.trim(),
                    document.getElementById('password').value
                );
                window.location.assign('/profile/');
            } catch (error) {
                showError(error);
            } finally {
                submitButton.disabled = false;
            }
        });

        document.getElementById('reset-password').addEventListener('click', async () => {
            const email = document.getElementById('email').value.trim();
            if (!email) {
                message.textContent = 'Masukkan email Anda terlebih dahulu untuk reset password.';
                document.getElementById('email').focus();
                return;
            }

            try {
                await sendPasswordResetEmail(auth, email);
                message.textContent = 'Tautan reset password telah dikirim ke email Anda.';
            } catch (error) {
                showError(error);
            }
        });
    </script>
</body>
</html>
