<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Akun Saya - Sitenexs</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --primary: #2563eb;
            --primary-dark: #1d4ed8;
            --primary-light: #eff6ff;
            --danger: #ef4444;
            --danger-dark: #dc2626;
            --bg-body: #f8fafc;
            --bg-card: #ffffff;
            --text-main: #0f172a;
            --text-muted: #475569;
            --border-subtle: #e2e8f0;
            --border-medium: #cbd5e1;
            --shadow-sm: 0 4px 12px -4px rgba(15,23,42,0.08);
            --radius-md: 0.75rem;
            --radius-lg: 1rem;
            --radius-xl: 1.5rem;
        }

        * { box-sizing: border-box; }
        
        body {
            margin: 0;
            font-family: 'Plus Jakarta Sans', sans-serif;
            background: var(--bg-body);
            color: var(--text-main);
            -webkit-font-smoothing: antialiased;
        }

        a { text-decoration: none; color: inherit; }
        button { font: inherit; outline: none; border: none; }
        
        .container {
            width: min(1000px, calc(100% - 2rem));
            margin: 0 auto;
        }

        /* --- TOPBAR --- */
        .topbar {
            display: flex;
            align-items: center;
            height: 70px;
            position: sticky;
            top: 0;
            background: rgba(255,255,255,0.9);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid var(--border-subtle);
            z-index: 40;
        }

        .brand {
            display: inline-flex;
            align-items: center;
            gap: 0.75rem;
            font-weight: 800;
            font-size: 1.2rem;
            color: var(--primary-dark);
        }

        .brand-mark {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            object-fit: cover;
            border: 1px solid var(--border-subtle);
        }

        /* --- TOMBOL --- */
        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            padding: 0.7rem 1.2rem;
            border-radius: 999px;
            font-weight: 700;
            font-size: 0.9rem;
            cursor: pointer;
            transition: 0.2s ease;
            border: 1px solid transparent;
        }

        .btn-primary { background: var(--primary); color: #fff; }
        .btn-primary:hover { background: var(--primary-dark); box-shadow: 0 4px 12px rgba(37,99,235,0.2); }
        
        .btn-danger { background: var(--danger); color: #fff; }
        .btn-danger:hover { background: var(--danger-dark); box-shadow: 0 4px 12px rgba(239,68,68,0.2); }

        .btn-outline { background: #fff; border-color: var(--border-medium); color: var(--text-main); }
        .btn-outline:hover { background: var(--bg-body); border-color: var(--text-muted); }

        .btn-sm { padding: 0.5rem 1rem; font-size: 0.85rem; }
        .btn-icon { padding: 0.4rem 0.6rem; color: var(--text-muted); border-radius: 999px; }
        .btn-icon:hover { color: var(--primary); background: var(--primary-light); }
        .btn-block { width: 100%; }

        /* --- TATA LETAK UTAMA --- */
        .page-header { padding: 2.5rem 0 1.5rem; }
        .page-header h1 { margin: 0; font-size: 1.8rem; font-weight: 800; letter-spacing: -0.02em; }

        .layout-grid {
            display: grid;
            grid-template-columns: 300px 1fr;
            gap: 1.5rem;
            padding-bottom: 4rem;
        }

        /* --- KARTU (PANEL) --- */
        .panel {
            background: var(--bg-card);
            border: 1px solid var(--border-subtle);
            border-radius: var(--radius-xl);
            box-shadow: var(--shadow-sm);
        }
        
        .panel-header {
            padding: 1.25rem 1.5rem;
            border-bottom: 1px solid var(--border-subtle);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .panel-title { margin: 0; font-size: 1.05rem; font-weight: 800; color: var(--text-main); }
        .panel-body { padding: 1.5rem; }

        /* --- PROFIL KIRI --- */
        .profile-card { text-align: center; }
        
        .avatar-container {
            position: relative;
            width: 110px;
            height: 110px;
            margin: 0 auto 1.2rem;
        }

        .avatar {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            background: var(--primary-light);
            border: 3px solid #fff;
            box-shadow: 0 0 0 1px var(--border-subtle);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2rem;
            font-weight: 800;
            color: var(--primary);
            overflow: hidden;
        }
        
        .avatar img { width: 100%; height: 100%; object-fit: cover; }

        .badge-edit-photo {
            position: absolute;
            bottom: 0;
            right: 0;
            background: var(--primary);
            color: #fff;
            width: 34px;
            height: 34px;
            border-radius: 50%;
            display: grid;
            place-items: center;
            cursor: pointer;
            border: 3px solid #fff;
            transition: 0.2s ease;
        }
        .badge-edit-photo:hover { transform: scale(1.05); background: var(--primary-dark); }

        .profile-name { font-size: 1.25rem; font-weight: 800; margin: 0 0 0.2rem; display: flex; align-items: center; justify-content: center; gap: 0.4rem; }
        .badge-verified { width: 16px; height: 16px; display: none; }
        .profile-email { color: var(--text-muted); font-size: 0.9rem; }
        .profile-id { font-size: 0.75rem; color: var(--text-muted); margin-top: 0.5rem; }

        /* --- BIO --- */
        .bio-section {
            margin-top: 1.5rem;
            padding-top: 1.5rem;
            border-top: 1px dashed var(--border-subtle);
            text-align: left;
        }
        .bio-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 0.5rem;
            font-size: 0.9rem;
            font-weight: 800;
        }
        .bio-text {
            font-size: 0.9rem;
            color: var(--text-muted);
            line-height: 1.5;
            white-space: pre-wrap;
        }

        /* --- BAGIAN KELUAR --- */
        .logout-section {
            margin-top: 1.5rem;
            padding-top: 1.5rem;
            border-top: 1px dashed var(--border-subtle);
        }

        /* --- DATA TABLE --- */
        .data-list { display: flex; flex-direction: column; }
        .data-row {
            display: grid;
            grid-template-columns: 140px 1fr;
            padding: 1rem 0;
            border-bottom: 1px solid var(--border-subtle);
            align-items: center;
        }
        .data-row:last-child { border-bottom: none; padding-bottom: 0; }
        .data-row:first-child { padding-top: 0; }

        .data-label { font-size: 0.9rem; color: var(--text-muted); font-weight: 600; }
        .data-value { font-size: 0.95rem; font-weight: 600; display: flex; align-items: center; justify-content: space-between; }

        /* --- LOGO BISNIS --- */
        .business-logo-wrap { display: flex; align-items: center; gap: 1rem; }
        .biz-logo-img {
            width: 60px; height: 60px;
            border: 1px dashed var(--border-medium);
            border-radius: var(--radius-md);
            object-fit: contain;
            background: var(--bg-body);
            display: grid; place-items: center;
            font-size: 0.8rem; color: var(--text-muted);
        }

        /* --- NOTIFIKASI --- */
        .alert {
            padding: 0.8rem 1rem;
            border-radius: var(--radius-md);
            font-size: 0.9rem;
            margin-top: 1rem;
            display: none;
            font-weight: 700;
        }
        .alert-info { background: var(--primary-light); color: var(--primary-dark); }
        .alert-error { background: #fef2f2; color: var(--danger-dark); }

        /* --- DIALOG CROP --- */
        .crop-dialog {
            width: min(400px, calc(100% - 2rem));
            padding: 1.5rem;
            border: 1px solid var(--border-subtle);
            border-radius: var(--radius-xl);
        }
        .crop-dialog::backdrop { background: rgba(15, 23, 42, 0.6); backdrop-filter: blur(3px); }
        .crop-canvas {
            display: block; width: 100%; max-width: 260px; aspect-ratio: 1;
            margin: 1rem auto; border-radius: 50%;
            cursor: grab; background: #e2e8f0;
        }
        .crop-canvas:active { cursor: grabbing; }

        @media (max-width: 768px) {
            .layout-grid { grid-template-columns: 1fr; }
            .data-row { grid-template-columns: 1fr; gap: 0.3rem; align-items: flex-start; }
        }
    </style>
</head>
<body>

    <!-- TOPBAR HANYA LOGO DAN BERANDA -->
    <header class="topbar">
        <div class="container" style="display:flex; align-items:center; justify-content:space-between;">
            <a href="https://sitenexs.com/" class="brand">
                <img src="https://sitenexs.com/assets/logo/logo.png" alt="Logo" class="brand-mark" onerror="this.onerror=null; this.src='https://ui-avatars.com/api/?name=Sitenexs&background=2563eb&color=fff&size=64';">
                Sitenexs
            </a>
            <a href="https://sitenexs.com/" class="btn btn-outline btn-sm"><i class="fas fa-home"></i> Beranda</a>
        </div>
    </header>

    <main class="container">
        <div class="page-header">
            <h1>Pengaturan Akun</h1>
            <div id="global-alert" class="alert"></div>
        </div>

        <div class="layout-grid">
            
            <!-- KOLOM KIRI (PROFIL & LOGOUT) -->
            <aside class="panel profile-card">
                <div class="panel-body">
                    
                    <div class="avatar-container">
                        <div id="avatar" class="avatar">
                            <img id="avatar-image" alt="" hidden>
                            <span id="avatar-initials">SN</span>
                        </div>
                        <input id="avatar-file" type="file" accept="image/png,image/jpeg,image/webp" hidden>
                        <button id="upload-avatar" class="badge-edit-photo" title="Ubah Foto">
                            <i class="fas fa-pencil-alt"></i>
                        </button>
                    </div>

                    <h2 class="profile-name">
                        <span id="profile-name">Memuat...</span>
                        <img id="profile-verified" src="https://sitenexs.com/assets/logo/verified.png" class="badge-verified">
                    </h2>
                    <div class="profile-email" id="profile-email">Memuat...</div>
                    <div class="profile-id" id="profile-uid">ID: -</div>

                    <!-- BIO -->
                    <div class="bio-section">
                        <div class="bio-header">
                            <span>Bio</span>
                            <button id="edit-bio" class="btn-icon"><i class="fas fa-pen"></i></button>
                        </div>
                        <div class="bio-text" id="profile-bio">-</div>
                    </div>

                    <!-- TOMBOL KELUAR DIPINDAH KE SINI -->
                    <div class="logout-section">
                        <button id="sign-out" class="btn btn-danger btn-block"><i class="fas fa-sign-out-alt"></i> Keluar</button>
                    </div>

                </div>
            </aside>

            <!-- KOLOM KANAN (DATA) -->
            <div style="display: flex; flex-direction: column; gap: 1.5rem;">
                
                <section class="panel">
                    <header class="panel-header">
                        <h3 class="panel-title">Informasi Pribadi</h3>
                        <button id="edit-profile" class="btn btn-outline btn-sm"><i class="fas fa-pen"></i> Ubah</button>
                    </header>
                    <div class="panel-body">
                        <div class="data-list">
                            <div class="data-row">
                                <div class="data-label">Nama Lengkap</div>
                                <div class="data-value" id="account-name">-</div>
                            </div>
                            <div class="data-row">
                                <div class="data-label">Email</div>
                                <div class="data-value">
                                    <span id="account-email">-</span>
                                    <span id="email-status" style="font-size: 0.75rem; padding: 0.2rem 0.6rem; border-radius: 999px; background: #e2e8f0;">-</span>
                                </div>
                            </div>
                            <div class="data-row">
                                <div class="data-label">Telepon</div>
                                <div class="data-value" id="account-phone">-</div>
                            </div>
                            <div class="data-row">
                                <div class="data-label">Alamat</div>
                                <div class="data-value" id="account-address">-</div>
                            </div>
                        </div>
                    </div>
                </section>

                <section class="panel">
                    <header class="panel-header">
                        <h3 class="panel-title">Profil Bisnis UMKM</h3>
                    </header>
                    <div class="panel-body">
                        <div class="data-list">
                            <div class="data-row">
                                <div class="data-label">Nama Bisnis</div>
                                <div class="data-value" id="business-name">-</div>
                            </div>
                            <div class="data-row">
                                <div class="data-label">Bidang Usaha</div>
                                <div class="data-value" id="business-field">-</div>
                            </div>
                            <div class="data-row" style="align-items: center;">
                                <div class="data-label">Logo Bisnis</div>
                                <div class="data-value">
                                    <div class="business-logo-wrap">
                                        <img id="business-logo" class="biz-logo-img" alt="Logo" onerror="this.style.display='none'; this.nextElementSibling.style.display='grid';">
                                        <div id="biz-logo-placeholder" class="biz-logo-img">Kosong</div>
                                        <input id="business-logo-file" type="file" accept="image/png,image/jpeg,image/webp" hidden>
                                        <button id="btn-edit-biz-logo" class="btn btn-outline btn-sm"><i class="fas fa-upload"></i> Unggah</button>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </section>

            </div>
        </div>
    </main>

    <!-- DIALOG CROP -->
    <dialog id="avatar-crop-dialog" class="crop-dialog">
        <h3 style="margin-top:0;">Sesuaikan Foto</h3>
        <p style="color:var(--text-muted); font-size:0.9rem;">Geser foto untuk menyesuaikan letak.</p>
        <canvas id="crop-canvas" class="crop-canvas" width="280" height="280"></canvas>
        <div style="margin-bottom: 1.5rem;">
            <label style="font-size:0.9rem; font-weight:700; display:block; margin-bottom:0.5rem;">Perbesar</label>
            <input id="crop-zoom" type="range" min="1" max="3" step="0.01" value="1" style="width: 100%;">
        </div>
        <div style="display: flex; justify-content: flex-end; gap: 0.75rem;">
            <button id="cancel-crop" class="btn btn-outline">Batal</button>
            <button id="apply-crop" class="btn btn-primary">Simpan</button>
        </div>
    </dialog>

    <script type="module">
        import { initializeApp } from 'https://www.gstatic.com/firebasejs/13.1.0/firebase-app.js';
        import { getAuth, onAuthStateChanged, signOut, updateProfile } from 'https://www.gstatic.com/firebasejs/13.1.0/firebase-auth.js';
        import { doc, getDoc, getFirestore, setDoc, updateDoc } from 'https://www.gstatic.com/firebasejs/13.1.0/firebase-firestore.js';
        
        const firebaseConfig = {
            apiKey: 'AIzaSyDuN4zlRaSnmcUSuXE_E84IE7d3Mz8E-N4',
            authDomain: 'sitenexs-62919.firebaseapp.com',
            projectId: 'sitenexs-62919',
            storageBucket: 'sitenexs-62919.firebasestorage.app',
            messagingSenderId: '1060348110644',
            appId: '1:1060348110644:web:e45af14d5f26a9cf8e6761'
        };
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        const supabaseUrl = 'https://xqcbyamxiekdxytntlno.supabase.co';
        const supabaseKey = 'sb_publishable_XKHXYrEw2EDdfYH17Uyx6w_k_BtGLQa';
        const bucketName = 'profile-photos'; 
        
        const alertBox = document.getElementById('global-alert');
        function showAlert(msg, isError = false) {
            alertBox.textContent = msg;
            alertBox.className = `alert ${isError ? 'alert-error' : 'alert-info'}`;
            alertBox.style.display = 'block';
            setTimeout(() => { alertBox.style.display = 'none'; }, 4000);
        }

        let currentUser = null;

        function renderAvatar(user) {
            const name = user.displayName || 'Pengguna';
            const initials = name.trim().split(/\s+/).slice(0, 2).map(p => p[0]).join('').toUpperCase();
            document.getElementById('avatar-initials').textContent = initials || 'S';
            
            const img = document.getElementById('avatar-image');
            img.src = `${supabaseUrl}/storage/v1/object/public/${bucketName}/${user.uid}/profile-photo?t=${Date.now()}`;
            img.hidden = false;
            document.getElementById('avatar-initials').hidden = true;
        }

        async function loadFirestoreData(user) {
            try {
                const snap = await getDoc(doc(db, 'users', user.uid));
                const data = snap.exists() ? snap.data() : {};
                const business = data.bisnis || {};
                
                document.getElementById('account-phone').textContent = data.noTelepon || '-';
                document.getElementById('account-address').textContent = data.alamat || '-';
                document.getElementById('business-name').textContent = business.nama || '-';
                document.getElementById('business-field').textContent = business.bidang || '-';
                
                if(data.bio) document.getElementById('profile-bio').textContent = data.bio;

                if (business.logoUrl) {
                    const bizImg = document.getElementById('business-logo');
                    bizImg.src = business.logoUrl;
                    bizImg.style.display = 'block';
                    document.getElementById('biz-logo-placeholder').style.display = 'none';
                }

                if (data.isVerified === true) {
                    document.getElementById('profile-verified').style.display = 'inline-block';
                }
            } catch (error) {
                showAlert('Gagal memuat data dari server.', true);
            }
        }

        onAuthStateChanged(auth, (user) => {
            if (!user) return window.location.replace('https://account.sitenexs.com/sign-in/');
            
            currentUser = user;
            renderAvatar(user);
            
            document.getElementById('profile-name').textContent = user.displayName || 'Pengguna';
            document.getElementById('profile-email').textContent = user.email || '-';
            document.getElementById('profile-uid').textContent = `ID: ${user.uid}`;
            
            document.getElementById('account-name').textContent = user.displayName || '-';
            document.getElementById('account-email').textContent = user.email || '-';
            
            const emailStatus = document.getElementById('email-status');
            if(user.emailVerified) {
                emailStatus.textContent = 'Terverifikasi';
                emailStatus.style.color = '#047857';
                emailStatus.style.background = '#d1fae5';
            } else {
                emailStatus.textContent = 'Belum Verifikasi';
                emailStatus.style.color = '#b91c1c';
                emailStatus.style.background = '#fee2e2';
            }
            
            loadFirestoreData(user);
        });

        // AKSI KELUAR
        document.getElementById('sign-out').addEventListener('click', async () => {
            await signOut(auth);
            window.location.assign('https://sitenexs.com/');
        });

        // UBAH NAMA
        document.getElementById('edit-profile').addEventListener('click', async () => {
            if (!currentUser) return;
            const nextName = window.prompt('Masukkan nama lengkap baru:', currentUser.displayName || '');
            if (!nextName?.trim()) return;

            try {
                const nameParts = nextName.trim().split(/\s+/);
                await updateProfile(currentUser, { displayName: nextName.trim() });
                
                await setDoc(doc(db, 'users', currentUser.uid), {
                    namaDepan: nameParts[0],
                    namaBelakang: nameParts.slice(1).join(' '),
                    namaLengkap: nextName.trim()
                }, { merge: true });
                
                document.getElementById('profile-name').textContent = nextName.trim();
                document.getElementById('account-name').textContent = nextName.trim();
                renderAvatar(currentUser);
                showAlert('Nama berhasil diperbarui.');
            } catch (error) {
                showAlert('Gagal memperbarui nama.', true);
            }
        });

        // UBAH BIO
        document.getElementById('edit-bio').addEventListener('click', async () => {
            if (!currentUser) return;
            const currentBio = document.getElementById('profile-bio').textContent;
            const bioPlaceholder = currentBio === '-' ? '' : currentBio;
            
            const nextBio = window.prompt('Tulis bio tentang Anda:', bioPlaceholder);
            if (nextBio === null) return; 

            try {
                await setDoc(doc(db, 'users', currentUser.uid), { bio: nextBio.trim() }, { merge: true });
                document.getElementById('profile-bio').textContent = nextBio.trim() || '-';
                showAlert('Bio berhasil diperbarui.');
            } catch (error) {
                showAlert('Gagal memperbarui bio.', true);
            }
        });

        // UPLOAD LOGO BISNIS
        const btnEditBizLogo = document.getElementById('btn-edit-biz-logo');
        const fileBizLogo = document.getElementById('business-logo-file');

        btnEditBizLogo.addEventListener('click', () => fileBizLogo.click());
        fileBizLogo.addEventListener('change', async (e) => {
            const file = e.target.files[0];
            if (!file || !currentUser) return;
            if (file.size > 2 * 1024 * 1024) return showAlert('Ukuran logo maksimal 2MB.', true);

            btnEditBizLogo.disabled = true;
            btnEditBizLogo.textContent = 'Memproses...';
            
            try {
                const path = `${currentUser.uid}/business-logo-${Date.now()}.jpg`;
                const res = await fetch(`${supabaseUrl}/storage/v1/object/${bucketName}/${path}`, {
                    method: 'POST',
                    headers: { 'apikey': supabaseKey, 'Content-Type': file.type },
                    body: file
                });
                
                if (!res.ok) throw new Error('Upload failed');
                
                const logoUrl = `${supabaseUrl}/storage/v1/object/public/${bucketName}/${path}`;
                await updateDoc(doc(db, 'users', currentUser.uid), { 'bisnis.logoUrl': logoUrl });

                const img = document.getElementById('business-logo');
                img.src = logoUrl;
                img.style.display = 'block';
                document.getElementById('biz-logo-placeholder').style.display = 'none';
                
                showAlert('Logo bisnis berhasil diubah.');
            } catch (err) {
                showAlert('Gagal mengunggah logo.', true);
            } finally {
                btnEditBizLogo.disabled = false;
                btnEditBizLogo.innerHTML = '<i class="fas fa-upload"></i> Unggah';
                fileBizLogo.value = '';
            }
        });

        // CROP & UPLOAD FOTO PROFIL
        const cropDialog = document.getElementById('avatar-crop-dialog');
        const cropCanvas = document.getElementById('crop-canvas');
        const cropCtx = cropCanvas.getContext('2d');
        const cropSize = cropCanvas.width;
        let cropImg = null, cropBase = 1, cropZoom = 1, cropX = 0, cropY = 0, dragPos = null;

        document.getElementById('upload-avatar').addEventListener('click', () => document.getElementById('avatar-file').click());
        document.getElementById('avatar-file').addEventListener('change', async (e) => {
            const file = e.target.files[0];
            if (!file) return;
            if (file.size > 5 * 1024 * 1024) return showAlert('Ukuran foto maksimal 5MB.', true);

            try {
                cropImg = await createImageBitmap(file);
                cropBase = cropSize / Math.min(cropImg.width, cropImg.height);
                cropZoom = 1;
                cropX = (cropSize - cropImg.width * cropBase) / 2;
                cropY = (cropSize - cropImg.height * cropBase) / 2;
                document.getElementById('crop-zoom').value = '1';
                drawCrop();
                cropDialog.showModal();
            } catch (err) {
                showAlert('Gagal memuat foto.', true);
            }
        });

        function clampCrop() {
            const w = cropImg.width * cropBase * cropZoom;
            const h = cropImg.height * cropBase * cropZoom;
            cropX = Math.min(0, Math.max(cropSize - w, cropX));
            cropY = Math.min(0, Math.max(cropSize - h, cropY));
        }

        function drawCrop() {
            const w = cropImg.width * cropBase * cropZoom;
            const h = cropImg.height * cropBase * cropZoom;
            cropCtx.clearRect(0, 0, cropSize, cropSize);
            cropCtx.drawImage(cropImg, cropX, cropY, w, h);
        }

        document.getElementById('crop-zoom').addEventListener('input', (e) => {
            const oldZ = cropZoom;
            cropZoom = Number(e.target.value);
            const cx = (cropSize / 2 - cropX) / (cropBase * oldZ);
            const cy = (cropSize / 2 - cropY) / (cropBase * oldZ);
            cropX = cropSize / 2 - cx * (cropBase * cropZoom);
            cropY = cropSize / 2 - cy * (cropBase * cropZoom);
            clampCrop(); drawCrop();
        });

        cropCanvas.addEventListener('pointerdown', e => { dragPos = {x: e.clientX, y: e.clientY}; cropCanvas.setPointerCapture(e.pointerId); });
        cropCanvas.addEventListener('pointermove', e => {
            if(!dragPos) return;
            cropX += (e.clientX - dragPos.x) * (cropSize / cropCanvas.getBoundingClientRect().width);
            cropY += (e.clientY - dragPos.y) * (cropSize / cropCanvas.getBoundingClientRect().height);
            dragPos = {x: e.clientX, y: e.clientY};
            clampCrop(); drawCrop();
        });
        cropCanvas.addEventListener('pointerup', () => dragPos = null);

        document.getElementById('cancel-crop').addEventListener('click', () => cropDialog.close());
        document.getElementById('apply-crop').addEventListener('click', async () => {
            if (!currentUser) return;
            const btn = document.getElementById('apply-crop');
            btn.disabled = true;
            btn.textContent = 'Memproses...';
            
            try {
                const blob = await new Promise(res => cropCanvas.toBlob(res, 'image/jpeg', 0.9));
                const path = `${currentUser.uid}/profile-photo`;
                
                await fetch(`${supabaseUrl}/storage/v1/object/${bucketName}/${path}`, {
                    method: 'POST',
                    headers: { 'apikey': supabaseKey, 'Content-Type': 'image/jpeg', 'x-upsert': 'true' },
                    body: blob
                });
                
                renderAvatar(currentUser);
                showAlert('Foto berhasil diubah.');
                cropDialog.close();
            } catch (err) {
                showAlert('Gagal menyimpan foto.', true);
            } finally {
                btn.disabled = false;
                btn.textContent = 'Simpan';
            }
        });

        document.getElementById('avatar-image').addEventListener('error', (e) => {
            e.target.hidden = true;
            document.getElementById('avatar-initials').hidden = false;
        });
    </script>
</body>
</html>
