<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profil Akun Mitra — Sitenexs</title>
    
    <!-- Meta SEO -->
    <meta name="description" content="Kelola informasi akun, profil, foto, logo bisnis, paket langganan, dan riwayat aktivitas Anda di ekosistem Sitenexs.">
    <link rel="icon" type="image/png" href="https://sitenexs.com/assets/logo/logo.png">

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            --primary: #2563eb;
            --primary-dark: #1d4ed8;
            --primary-light: #eff6ff;
            --accent: #10b981;
            --bg-body: #f8fafc;
            --bg-card: #ffffff;
            --bg-alt: #f1f5f9;
            --text-main: #0f172a;
            --text-muted: #475569;
            --border-subtle: #e2e8f0;
            --border-medium: #cbd5e1;
            --border-accent: #93c5fd;
            --shadow-sm: 0 1px 3px rgba(15, 23, 42, 0.05);
            --shadow-md: 0 4px 12px -2px rgba(15, 23, 42, 0.08);
            --shadow-lg: 0 15px 30px -5px rgba(15, 23, 42, 0.08);
            --shadow-card: 0 20px 40px -12px rgba(37, 99, 235, 0.15);
            --radius-sm: 0.375rem;
            --radius-md: 0.625rem;
            --radius-lg: 1rem;
            --radius-xl: 1.5rem;
            --radius-full: 9999px;
            --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        /* SISTEM TEMA PAKET LANGGANAN */
        body[data-package="pro"] {
            --primary: #0284c7;
            --primary-dark: #0369a1;
            --primary-light: #f0f9ff;
            --accent: #f59e0b;
            --border-accent: #38bdf8;
            --shadow-card: 0 20px 40px -12px rgba(2, 132, 199, 0.22);
        }

        body[data-package="pro"] .profile-header-card::before {
            background: linear-gradient(90deg, #0284c7 0%, #f59e0b 100%);
        }

        body[data-package="pro"] .btn-primary {
            background: linear-gradient(135deg, #0284c7 0%, #0369a1 100%);
            box-shadow: 0 4px 15px rgba(2, 132, 199, 0.35);
        }

        body[data-package="vip"],
        body[data-package="ultimate"],
        body[data-package="premium"] {
            --primary: #7c3aed;
            --primary-dark: #6d28d9;
            --primary-light: #f5f3ff;
            --accent: #fbbf24;
            --border-accent: #c084fc;
            --shadow-card: 0 25px 50px -12px rgba(124, 58, 237, 0.28);
        }

        body[data-package="vip"] #navbar,
        body[data-package="ultimate"] #navbar,
        body[data-package="premium"] #navbar {
            border-bottom: 2px solid transparent;
            border-image: linear-gradient(90deg, #7c3aed, #fbbf24, #7c3aed) 1;
        }

        body[data-package="vip"] .profile-header-card,
        body[data-package="ultimate"] .profile-header-card,
        body[data-package="premium"] .profile-header-card {
            background: linear-gradient(145deg, #ffffff 0%, #faf5ff 100%);
            border: 1px solid rgba(124, 58, 237, 0.3);
            box-shadow: 0 20px 45px -10px rgba(124, 58, 237, 0.25);
        }

        body[data-package="vip"] .profile-header-card::before,
        body[data-package="ultimate"] .profile-header-card::before,
        body[data-package="premium"] .profile-header-card::before {
            height: 6px;
            background: linear-gradient(90deg, #7c3aed 0%, #fbbf24 50%, #d97706 100%);
        }

        body[data-package="vip"] .btn-primary,
        body[data-package="ultimate"] .btn-primary,
        body[data-package="premium"] .btn-primary {
            background: linear-gradient(135deg, #7c3aed 0%, #d97706 100%);
            box-shadow: 0 6px 20px rgba(124, 58, 237, 0.4);
            border: 1px solid rgba(254, 240, 138, 0.5);
        }

        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
        html { scroll-behavior: smooth; font-size: 15px; }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: var(--bg-body);
            color: var(--text-main);
            line-height: 1.4;
            -webkit-font-smoothing: antialiased;
            overflow-x: hidden;
            transition: background-color 0.4s ease, color 0.4s ease;
        }

        body.dialog-open { overflow: hidden; }
        a { text-decoration: none; color: inherit; }
        ul { list-style: none; }
        button, input, textarea, select { font-family: inherit; outline: none; border: none; }

        .container { width: 100%; max-width: 680px; margin: 0 auto; padding: 0 1rem; }

        .text-primary { color: var(--primary); }
        .text-muted { color: var(--text-muted); }

        /* BUTTONS */
        .btn {
            display: inline-flex; align-items: center; justify-content: center; gap: 0.4rem;
            padding: 0.6rem 1.2rem; font-size: 0.85rem; font-weight: 700;
            border-radius: var(--radius-full); cursor: pointer; transition: var(--transition);
            white-space: nowrap; border: 1px solid transparent; text-align: center;
        }
        .btn-primary { background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%); color: #fff; box-shadow: 0 4px 12px rgba(37, 99, 235, 0.25); }
        .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 6px 16px rgba(37, 99, 235, 0.35); }
        .btn-secondary { background: #fff; border: 1px solid var(--border-medium); color: var(--text-main); box-shadow: var(--shadow-sm); }
        .btn-secondary:hover { border-color: var(--primary); color: var(--primary); }
        .btn-danger { background: #fee2e2; color: #ef4444; border: 1px solid #fecaca; }
        .btn-danger:hover { background: #ef4444; color: #fff; }
        
        .btn-icon-only {
            width: 38px; height: 38px; padding: 0; border-radius: 50%;
            display: inline-flex; align-items: center; justify-content: center; font-size: 0.95rem;
        }

        /* NAVBAR */
        #navbar {
            position: sticky; top: 0; z-index: 1000; background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(12px); border-bottom: 1px solid var(--border-subtle); box-shadow: var(--shadow-sm);
            transition: border-color 0.3s ease;
        }
        .nav-container { display: flex; align-items: center; justify-content: space-between; height: 65px; width: 100%; max-width: 680px; margin: 0 auto; padding: 0 1rem; }
        .logo { display: flex; align-items: center; gap: 0.5rem; font-weight: 800; font-size: 1.1rem; color: var(--text-main); }
        .logo img { height: 32px; width: 32px; border-radius: 50%; object-fit: cover; border: 2px solid #fff; box-shadow: var(--shadow-sm); }
        .logo-text { background: linear-gradient(135deg, #1e3a8a 0%, #2563eb 50%, #10b981 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; text-transform: uppercase; font-weight: 800; letter-spacing: -0.02em; }
        .nav-actions { display: flex; gap: 0.5rem; align-items: center; }

        /* TOMBOL MENU PROFIL DI NAVBAR */
        .nav-profile-menu-btn {
            display: inline-flex; align-items: center; gap: 0.4rem; background: #fff;
            border: 1px solid var(--border-medium); padding: 0.25rem 0.65rem 0.25rem 0.25rem;
            border-radius: var(--radius-full); cursor: pointer; transition: var(--transition);
            box-shadow: var(--shadow-sm);
        }
        .nav-profile-menu-btn:hover { border-color: var(--primary); }
        .nav-profile-avatar {
            width: 28px; height: 28px; border-radius: 50%; object-fit: cover;
            border: 2px solid var(--primary); flex-shrink: 0;
        }
        /* Border tema khusus paket di navbar */
        body[data-package="pro"] .nav-profile-avatar { border-color: #0284c7; }
        body[data-package="vip"] .nav-profile-avatar,
        body[data-package="ultimate"] .nav-profile-avatar,
        body[data-package="premium"] .nav-profile-avatar { border-color: #7c3aed; }

        /* PROFILE LAYOUT */
        .profile-wrapper { padding: 1.5rem 0 4rem 0; width: 100%; }
        
        .profile-header-card {
            background: var(--bg-card); border: 1px solid var(--border-subtle); border-radius: var(--radius-xl);
            padding: 1.75rem 1.25rem; box-shadow: var(--shadow-md); display: flex; flex-direction: column; align-items: center;
            text-align: center; margin-bottom: 1.25rem; position: relative; overflow: hidden;
            transition: var(--transition);
        }

        .profile-header-card::before {
            content: ''; position: absolute; top: 0; left: 0; right: 0; height: 5px;
            background: linear-gradient(90deg, var(--primary) 0%, var(--accent) 100%);
            transition: var(--transition);
        }

        .profile-avatar-container {
            position: relative; width: 110px; height: 110px; margin-bottom: 0.85rem;
        }
        .profile-avatar-wrapper {
            width: 110px; height: 110px; border-radius: 50%; overflow: hidden; border: 3px solid var(--primary-light);
            box-shadow: var(--shadow-md); background: #e2e8f0; display: grid; place-items: center; position: relative;
        }
        .profile-avatar {
            width: 100%; height: 100%; object-fit: cover; display: block;
        }
        .avatar-initials {
            font-size: 2rem; font-weight: 800; color: var(--text-muted); background: #cbd5e1;
            width: 100%; height: 100%; display: grid; place-items: center;
        }
        .create-post-trigger-btn {
            position: absolute; bottom: 4px; right: 4px; background: var(--primary); color: #fff;
            width: 26px; height: 26px; border-radius: 50%; display: flex; align-items: center; justify-content: center;
            font-size: 0.7rem; cursor: pointer; border: 2px solid #fff; transition: var(--transition);
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
        }
        .create-post-trigger-btn:hover { background: var(--primary-dark); transform: scale(1.1); }

        .profile-name-row { display: flex; align-items: center; justify-content: center; gap: 0.35rem; margin-bottom: 0.15rem; }
        .profile-name { font-size: 1.2rem; font-weight: 800; color: var(--text-main); line-height: 1.3; }
        .verified-badge { width: 16px; height: 16px; object-fit: contain; }
        .profile-email { font-size: 0.82rem; color: var(--text-muted); margin-bottom: 0.75rem; word-break: break-all; }
        
        .profile-badges-wrapper {
            display: flex; flex-direction: column; align-items: center; gap: 0.4rem; margin-bottom: 1rem; width: 100%;
        }
        .profile-business-tag { font-size: 0.75rem; font-weight: 700; color: var(--primary); background: var(--primary-light); padding: 0.25rem 0.8rem; border-radius: var(--radius-full); display: inline-flex; align-items: center; gap: 0.35rem; border: 1px solid rgba(37,99,235,0.15); }

        .profile-stats {
            display: flex; gap: 2rem; border-top: 1px solid var(--border-subtle); border-bottom: 1px solid var(--border-subtle);
            padding: 0.75rem 1rem; width: 100%; justify-content: center; margin-bottom: 0.25rem;
        }
        .stat-item { text-align: center; }
        .stat-value { font-weight: 800; font-size: 1.05rem; color: var(--text-main); }
        .stat-label { font-size: 0.68rem; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.05em; margin-top: 0.1rem; }

        .profile-card {
            background: var(--bg-card); border: 1px solid var(--border-subtle); border-radius: var(--radius-xl);
            padding: 1.25rem; box-shadow: var(--shadow-sm); margin-bottom: 1.25rem;
            transition: var(--transition);
        }
        .card-title { font-size: 0.95rem; font-weight: 800; margin-bottom: 1rem; display: flex; align-items: center; justify-content: space-between; color: var(--text-main); }
        
        .my-posts-list { 
            display: flex; 
            flex-direction: column; 
            gap: 0.85rem; 
            width: 100%;
        }

        /* KARTU POSTINGAN */
        .post-card {
            background: var(--bg-card); border: 1px solid var(--border-subtle); border-radius: var(--radius-md);
            padding: 0; box-shadow: var(--shadow-sm); transition: var(--transition); animation: fadeIn 0.3s ease; width: 100%; overflow: hidden;
            user-select: none; -webkit-touch-callout: none; text-align: left; position: relative;
        }
        .post-card-inner { padding: 0.85rem; }
        
        @keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
        
        .post-header { display: flex; align-items: flex-start; justify-content: space-between; margin-bottom: 0.65rem; gap: 0.4rem; }
        .post-author { display: flex; align-items: center; gap: 0.5rem; min-width: 0; flex: 1; }
        .post-author-img { width: 34px; height: 34px; border-radius: 50%; object-fit: cover; border: 1px solid rgba(0,0,0,0.08); flex-shrink: 0; }
        
        .author-info { display: flex; flex-direction: column; justify-content: center; min-width: 0; }
        .author-name-row { display: flex; align-items: center; gap: 0.25rem; min-width: 0; }
        .author-name-link { text-decoration: none; color: inherit; display: inline-flex; align-items: center; min-width: 0; }
        .author-name-link:hover .author-name { text-decoration: underline; color: var(--primary); }
        .author-name { 
            font-weight: 800; font-size: 0.85rem; color: var(--text-main); 
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis; line-height: 1.3; 
        }
        .member-verification-icon { width: 13px; height: 13px; object-fit: contain; flex-shrink: 0; transform: translateY(0.5px); }
        .author-time-wrapper { display: flex; align-items: center; gap: 0.4rem; font-size: 0.65rem; color: var(--text-muted); font-weight: 500; margin-top: 0.05rem; }
        
        .post-options-container { position: relative; }
        .post-options-btn {
            background: transparent; border: none; width: 28px; height: 28px; border-radius: 50%;
            display: flex; align-items: center; justify-content: center; color: var(--text-muted);
            cursor: pointer; transition: var(--transition); font-size: 0.9rem;
        }
        .post-options-btn:hover { background: var(--bg-body); color: var(--text-main); }

        .post-options-dropdown {
            position: absolute; top: 100%; right: 0; background: #fff; border: 1px solid var(--border-subtle);
            border-radius: var(--radius-md); box-shadow: var(--shadow-md); width: 230px; z-index: 100;
            display: none; padding: 0.4rem; animation: fadeIn 0.2s ease;
        }
        .post-options-dropdown.active { display: block; }
        .option-item {
            display: flex; align-items: center; gap: 0.5rem; padding: 0.5rem 0.75rem;
            font-size: 0.75rem; font-weight: 600; color: var(--text-main); border-radius: var(--radius-sm);
            cursor: pointer; transition: var(--transition); background: transparent; width: 100%; text-align: left;
        }
        .option-item:hover { background: var(--primary-light); color: var(--primary); }
        .option-item i { width: 16px; text-align: center; }

        .post-title { font-size: 0.95rem; font-weight: 800; margin-bottom: 0.3rem; line-height: 1.3; color: var(--text-main); word-break: break-word; }
        .post-content { font-size: 0.8rem; color: var(--text-main); margin-bottom: 0.65rem; line-height: 1.45; white-space: pre-wrap; word-break: break-word; }
        .post-image { width: 100%; max-height: 350px; object-fit: cover; border-radius: var(--radius-sm); margin-bottom: 0.65rem; border: 1px solid var(--border-subtle); }

        .post-actions {
            display: flex; align-items: center; justify-content: space-between; 
            border-top: 1px solid var(--border-subtle); padding: 0.3rem 0.5rem; gap: 0.25rem;
        }
        .action-btn { 
            flex: 1 1 0px; display: inline-flex; align-items: center; justify-content: center; 
            gap: 0.35rem; color: var(--text-muted); font-size: 0.75rem; font-weight: 600; 
            cursor: pointer; transition: all 0.2s; background: transparent; padding: 0.45rem 0.2rem; 
            border-radius: var(--radius-sm); border: none; white-space: nowrap;
        }
        .action-btn:hover { background: var(--bg-body); color: var(--text-main); }
        .action-btn.liked { color: #ef4444; }
        .action-btn.delete-btn { color: #ef4444; }
        .action-btn.delete-btn:hover { background: #fef2f2; color: #dc2626; }

        /* KOMENTAR */
        .comments-section {
            background: #fafafa; border-top: 1px solid var(--border-subtle);
            padding: 0.85rem; display: none; opacity: 0; transform: translateY(-8px);
            transition: opacity 0.25s ease, transform 0.25s ease;
        }
        .comments-section.active { 
            display: block; opacity: 1; transform: translateY(0); 
        }
        .comment-list { display: flex; flex-direction: column; gap: 0.65rem; margin-bottom: 0.85rem; max-height: 250px; overflow-y: auto; padding-right: 0.4rem; }
        .comment-item { display: flex; gap: 0.5rem; align-items: flex-start; }
        .comment-avatar { width: 28px; height: 28px; border-radius: 50%; object-fit: cover; border: 1px solid var(--border-subtle); flex-shrink: 0; }
        
        .comment-content-wrapper { flex: 1; min-width: 0; }
        .comment-bubble {
            background: var(--bg-body); padding: 0.4rem 0.6rem; 
            border-radius: 0 var(--radius-md) var(--radius-md) var(--radius-md);
            display: inline-block; width: 100%; border: 1px solid var(--border-subtle);
        }
        .comment-header-row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 0.15rem; }
        .comment-author-left { display: flex; align-items: center; gap: 0.25rem; min-width: 0; }
        .comment-author-link { text-decoration: none; color: inherit; display: inline-flex; align-items: center; min-width: 0; }
        .comment-author-link:hover .comment-author { text-decoration: underline; color: var(--primary); }
        .comment-author { font-weight: 800; font-size: 0.75rem; color: var(--text-main); line-height: 1.3; }
        .comment-text { font-size: 0.75rem; color: var(--text-main); word-break: break-word; line-height: 1.35; }
        .comment-footer-row { display: flex; align-items: center; gap: 0.5rem; margin-top: 0.2rem; margin-left: 0.3rem; }
        .comment-time { font-size: 0.6rem; color: var(--text-muted); font-weight: 500; }
        .reply-trigger-btn, .delete-comment-btn { background: none; border: none; font-size: 0.65rem; font-weight: 700; cursor: pointer; padding: 0; }
        .reply-trigger-btn { color: var(--primary); }
        .delete-comment-btn { color: #ef4444; }

        .comment-form { display: flex; gap: 0.5rem; align-items: center; position: relative; }
        .comment-form-avatar { width: 28px; height: 28px; border-radius: 50%; object-fit: cover; border: 1px solid var(--border-subtle); flex-shrink: 0; }
        .comment-input-wrapper { flex: 1; display: flex; align-items: center; background: #fff; border: 1px solid var(--border-medium); border-radius: var(--radius-full); padding: 0.15rem 0.15rem 0.15rem 0.65rem; position: relative; }
        .comment-input { flex: 1; background: transparent; font-size: 0.75rem; color: var(--text-main); height: 28px; }
        .comment-submit-btn { width: 28px; height: 28px; border-radius: 50%; background: var(--primary); color: #fff; display: flex; align-items: center; justify-content: center; cursor: pointer; border: none; flex-shrink: 0; }

        /* SIDEBAR DRAWER */
        .sidebar-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(15, 23, 42, 0.5); backdrop-filter: blur(4px);
            z-index: 9999; opacity: 0; visibility: hidden; transition: var(--transition);
        }
        .sidebar-overlay.active { opacity: 1; visibility: visible; }
        
        .sidebar-drawer {
            position: fixed; top: 0; right: -360px; width: min(340px, 85vw); height: 100%;
            background: #fff; z-index: 10000; box-shadow: -10px 0 30px rgba(15, 23, 42, 0.15);
            transition: right 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            display: flex; flex-direction: column; overflow-y: auto; padding: 1.25rem;
        }
        .sidebar-drawer.active { right: 0; }
        
        .sidebar-header {
            display: flex; justify-content: space-between; align-items: center;
            padding-bottom: 0.85rem; margin-bottom: 1.25rem; border-bottom: 1px solid var(--border-subtle);
        }
        .sidebar-title { font-size: 1rem; font-weight: 800; color: var(--text-main); display: flex; align-items: center; gap: 0.4rem; }
        .close-sidebar-btn { background: var(--bg-body); border: none; width: 30px; height: 30px; border-radius: 50%; color: var(--text-muted); cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 0.85rem; }
        
        .form-group { margin-bottom: 1rem; }
        .form-label { display: block; font-size: 0.8rem; font-weight: 700; color: var(--text-main); margin-bottom: 0.35rem; }
        .form-control {
            width: 100%; padding: 0.65rem 0.85rem; border: 1px solid var(--border-medium);
            border-radius: var(--radius-md); font-size: 0.85rem; background: var(--bg-body); color: var(--text-main);
        }
        .form-control:focus { background: #fff; border-color: var(--primary); box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.12); }
        .business-logo-preview { width: 44px; height: 44px; border-radius: var(--radius-md); object-fit: cover; border: 1px solid var(--border-medium); background: #fff; }

        /* MODAL POSTING */
        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(15, 23, 42, 0.7); backdrop-filter: blur(3px);
            z-index: 9999; display: flex; align-items: center; justify-content: center;
            opacity: 0; visibility: hidden; transition: all 0.2s ease; padding: 1rem;
        }
        .modal-overlay.active { opacity: 1; visibility: visible; }
        .modal-content {
            background: #fff; width: 100%; max-width: 480px; border-radius: var(--radius-lg);
            padding: 1.25rem; transform: translateY(15px); transition: all 0.2s ease; box-shadow: var(--shadow-lg);
            max-height: 90vh; overflow-y: auto;
        }
        .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem; padding-bottom: 0.65rem; border-bottom: 1px solid var(--border-subtle); }
        .close-modal { background: var(--bg-body); width: 26px; height: 26px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 0.85rem; color: var(--text-muted); cursor: pointer; border: none; }

        /* DIALOG CROP FOTO PROFIL */
        .crop-dialog {
            width: min(380px, calc(100% - 2rem)); padding: 1.25rem; border: 1px solid var(--border-subtle);
            border-radius: var(--radius-lg); background: #fff; box-shadow: var(--shadow-lg); margin: auto;
        }
        .crop-dialog::backdrop { background: rgba(15, 23, 42, 0.6); backdrop-filter: blur(4px); }
        .crop-canvas { display: block; width: 220px; height: 220px; margin: 1rem auto; border-radius: 50%; background: #e2e8f0; cursor: grab; }
        .crop-actions { display: flex; justify-content: flex-end; gap: 0.5rem; margin-top: 1rem; }

    <script type="module">

        async function fetchAllUsersForMention() {
            try {
                const usersSnap = await getDocs(collection(db, "users"));
                allRegisteredUsers = [];
                usersSnap.forEach(dSnap => {
                    const d = dSnap.data();
                    const name = d.namaLengkap || (d.namaDepan + (d.namaBelakang ? ' ' + d.namaBelakang : '')) || "Mitra";
                    allRegisteredUsers.push({
                        uid: dSnap.id,

        window.replyComment = function(postId, authorName) {

            if (inputEl) {
                inputEl.value = `@${authorName} ` + inputEl.value;
                inputEl.focus();
            }

        function formatCommentText(text) {
            if (!text) return '';
            let formatted = text;
            allRegisteredUsers.forEach(u => {
                const escapedName = u.nama.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
                const regex = new RegExp(`@(${escapedName})\\b`, 'gi');
                formatted = formatted.replace(regex, `<a href="https://sitenexs.com/community/profile?uid=${encodeURIComponent(u.uid)}" style="color:var(--primary); font-weight:750;">@$1</a>`);
            });
            return formatted;
        }

        function timeAgo(date) {
            if (!date) return 'Baru saja';
            const seconds = Math.floor((new Date() - date) / 1000);
            let interval = seconds / 31536000;
            if (interval > 1) return Math.floor(interval) + "th lalu";
            interval = seconds / 2592000;
            if (interval > 1) return Math.floor(interval) + "bln lalu";
            interval = seconds / 86400;
            if (interval > 1) return Math.floor(interval) + "hr lalu";
            interval = seconds / 3600;
            if (interval > 1) return Math.floor(interval) + "j lalu";
            interval = seconds / 60;
            if (interval > 1) return Math.floor(interval) + "m lalu";
            return "Baru saja";
        }

        window.togglePostOptions = function(postId, event) {
            event.stopPropagation();
            document.querySelectorAll('.post-options-dropdown').forEach(d => {

            const dropdown = document.getElementById(`options-dropdown-${postId}`);
            if (dropdown) dropdown.classList.toggle('active');

                showToast("Gagal mengubah pengaturan.", "error");
            }
        };

        function applyUserPackageTheme(paketLangganan) {
            const pkg = (paketLangganan || 'basic').toLowerCase();
            let themeCategory = 'basic';
            if (pkg.includes('pro') || pkg.includes('business')) themeCategory = 'pro';
            else if (pkg.includes('vip') || pkg.includes('ultimate') || pkg.includes('premium')) themeCategory = 'vip';

            document.body.setAttribute('data-package', themeCategory);
            const logoTextEl = document.getElementById('navLogoText');
            if (logoTextEl) {
                logoTextEl.innerText = (themeCategory === 'basic') ? 'SITENEXS' : paketLangganan.toUpperCase();
            }
        }

        function renderAvatar(user) {
            const profilePhotoUrl = `${supabaseUrl}/storage/v1/object/public/${avatarBucket}/${encodeURIComponent(user.uid)}/profile-photo?t=${Date.now()}`;
            const fallbackAvatar = `https://ui-avatars.com/api/?name=${encodeURIComponent(user.displayName || 'User')}&background=2563eb&color=fff`;

            avatarImg.onload = () => { avatarImg.hidden = false; avatarInitials.hidden = true; };
            avatarImg.onerror = () => { avatarImg.hidden = true; avatarInitials.hidden = false; };
            avatarImg.src = profilePhotoUrl;
            
            sidebarAvatarPreview.src = profilePhotoUrl;
            sidebarAvatarPreview.onerror = () => { sidebarAvatarPreview.src = fallbackAvatar; };

            navProfileAvatarImg.src = profilePhotoUrl;
            navProfileAvatarImg.onerror = () => { navProfileAvatarImg.src = fallbackAvatar; };
        }

        async function loadUserData(user) {
            currentUid = user.uid;
            currentUser = user;
            renderAvatar(user);

            try {
                const userDocSnap = await getDoc(doc(db, "users", user.uid));
                let d = {
                    namaDepan: user.displayName?.split(' ')[0] || '',
                    namaBelakang: user.displayName?.split(' ').slice(1).join(' ') || '',
                    namaLengkap: user.displayName || 'Mitra Sitenexs',
                    bisnisNama: 'UMKM / Bisnis Mitra',
                    paketLangganan: 'Basic',
                    email: user.email || '',
                    isVerified: false
                };

                if (userDocSnap.exists()) {
                    const data = userDocSnap.data();
                    d.namaDepan = data.namaDepan || d.namaDepan;
                    d.namaBelakang = data.namaBelakang || d.namaBelakang;
                    d.namaLengkap = data.namaLengkap || (d.namaDepan + ' ' + d.namaBelakang).trim() || d.namaLengkap;
                    d.bisnisNama = data.bisnis?.nama || data.bisnisNama || d.bisnisNama;
                    d.paketLangganan = (data.paketLangganan || data.paket || 'Basic').replace(/^(paket\s*)+/i, '').trim();
                    d.email = data.email || user.email || '';
                    d.isVerified = data.isVerified || false;
                }

                applyUserPackageTheme(d.paketLangganan);
                inputNamaDepan.value = d.namaDepan;
                inputNamaBelakang.value = d.namaBelakang;
                headerName.innerText = d.namaLengkap;
                headerEmail.innerText = d.email;
                headerBusiness.innerHTML = `<i class="fas fa-store"></i> ${d.bisnisNama}`;

                currentUserData = { uid: user.uid, nama: d.namaLengkap, isVerified: d.isVerified, avatar: profilePhotoUrl };
                logoPreviewImg.src = `${supabaseUrl}/storage/v1/object/public/${logoBucket}/${encodeURIComponent(user.uid)}/business-logo?t=${Date.now()}`;

                subscribeUserPosts(user.uid);

            localStorage.setItem('sitenexs_logged_in', 'true');
        }

            if (user) loadUserData(user);
            else {
                const savedUid = localStorage.getItem('sitenexs_uid');
                if (localStorage.getItem('sitenexs_logged_in') === 'true' && savedUid) {

        avatarFileInput.addEventListener('change', async () => {
            const file = avatarFileInput.files[0];
            if (file) {
                cropImage = await createImageBitmap(file);
                cropBaseScale = cropSize / Math.min(cropImage.width, cropImage.height);

            const filePath = `${currentUid}/business-logo`;
            await fetch(`${supabaseUrl}/storage/v1/object/${logoBucket}/${filePath}`, {
                method: 'POST', headers: { apikey: supabasePublishableKey, 'Content-Type': file.type, 'x-upsert': 'true' }, body: file
            });
            logoPreviewImg.src = `${supabaseUrl}/storage/v1/object/public/${logoBucket}/${filePath}?t=${Date.now()}`;
            showToast("Logo bisnis diperbarui!");
        };

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            if (!currentUid) return;
            const content = document.getElementById('postContent').value.trim();
            if (!content) return;

            let imageUrl = null;
            const file = document.getElementById('postImage').files[0];
            if (file) {
                const fileName = `${Date.now()}.${file.name.split('.').pop()}`;
                const res = await fetch(`${supabaseUrl}/storage/v1/object/${forumBucket}/${fileName}`, {
                    method: 'POST', headers: { 'Authorization': `Bearer ${supabasePublishableKey}`, 'apikey': supabasePublishableKey, 'Content-Type': file.type }, body: file
                });
                if (res.ok) imageUrl = `${supabaseUrl}/storage/v1/object/public/${forumBucket}/${fileName}`;
            }

            await addDoc(forumCollection, {
                authorUid: currentUid, penulis: headerName.innerText, isVerified: currentUserData?.isVerified || false,
                judul: document.getElementById('postTitle').value.trim(), isi: content, imageUrl, likes: [], comments: [], createdAt: serverTimestamp()
            });

            form.reset(); removeImage(); closeModal();
            showToast("Diskusi berhasil diposting!");
        });

        function subscribeUserPosts(uid) {
            onSnapshot(query(collection(db, "forum_posts"), where("authorUid", "==", uid)), (snapshot) => {
                statPostCount.innerText = snapshot.size;
                let totalLikes = 0, docsList = [];
                snapshot.forEach(docSnap => {
                    const data = docSnap.data();
                    docsList.push({ id: docSnap.id, data });
                    if (Array.isArray(data.likes)) totalLikes += data.likes.length;
                });
                statLikeCount.innerText = totalLikes;

                if (docsList.length === 0) {
                    myPostsContainer.innerHTML = '<div style="text-align:center; padding:1rem; color:var(--text-muted);">Belum ada postingan.</div>';
                    return;
                }

                docsList.sort((a, b) => (b.data.createdAt?.toDate().getTime() || 0) - (a.data.createdAt?.toDate().getTime() || 0));
                
                let html = "";
                docsList.forEach(item => {
                    const d = item.data;
                    const isLiked = Array.isArray(d.likes) && d.likes.includes(uid);
                    html += `
                        <article class="post-card" data-post-id="${item.id}">
                            <div class="post-card-inner">
                                <div class="post-header">
                                    <div class="post-author">
                                        <img src="${supabaseUrl}/storage/v1/object/public/${avatarBucket}/${encodeURIComponent(uid)}/profile-photo" class="post-author-img" onerror="this.src='https://ui-avatars.com/api/?name=User&background=2563eb&color=fff'">
                                        <div class="author-info">
                                            <span class="author-name">${d.penulis}</span>
                                            <span class="author-time-wrapper">${timeAgo(d.createdAt?.toDate())}</span>
                                        </div>
                                    </div>
                                    <button class="post-options-btn" onclick="togglePostOptions('${item.id}', event)"><i class="fas fa-ellipsis-v"></i></button>
                                    <div class="post-options-dropdown" id="options-dropdown-${item.id}">
                                        <button class="option-item" onclick="updatePostSetting('${item.id}', 'isPrivate', ${!d.isPrivate})"><i class="fas fa-lock"></i> ${d.isPrivate ? 'Publik' : 'Privat'}</button>
                                        <button class="option-item" onclick="updatePostSetting('${item.id}', 'commentsDisabled', ${!d.commentsDisabled})"><i class="fas fa-comment-slash"></i> ${d.commentsDisabled ? 'Buka Komentar' : 'Matikan Komentar'}</button>
                                    </div>
                                </div>
                                ${d.judul ? `<h2 class="post-title">${d.judul}</h2>` : ''}
                                <p class="post-content">${d.isi}</p>
                                ${d.imageUrl ? `<img src="${d.imageUrl}" class="post-image">` : ''}
                            </div>
                            <div class="post-actions">
                                <button class="action-btn ${isLiked ? 'liked' : ''}" onclick="toggleLike('${item.id}')"><i class="${isLiked ? 'fas' : 'far'} fa-thumbs-up"></i> <span>${d.likes?.length || ''} Suka</span></button>
                                <button class="action-btn" onclick="toggleComments('${item.id}')"><i class="far fa-comment-alt"></i> <span>${d.comments?.length || ''} Komentar</span></button>
                                <button class="action-btn delete-btn" onclick="deletePost('${item.id}')"><i class="fas fa-trash-alt"></i> Hapus</button>
                            </div>
                            <div class="comments-section" id="comments-${item.id}">
                                <div class="comment-list">${(d.comments || []).map(c => `<div class="comment-text"><b>${c.penulis}:</b> ${c.isi}</div>`).join('') || 'Belum ada komentar.'}</div>
                                <form class="comment-form" onsubmit="submitComment(event, '${item.id}')">
                                    <div class="comment-input-wrapper"><input type="text" id="comment-input-${item.id}" class="comment-input" placeholder="Tulis komentar..." required></div>
                                    <button type="submit" class="comment-submit-btn"><i class="fas fa-paper-plane"></i></button>
                                </form>
                            </div>
                        </article>
                    `;
                });
                myPostsContainer.innerHTML = html;
            });
        }

        window.toggleLike = async function(postId) {
            const ref = doc(db, "forum_posts", postId);
            const snap = await getDoc(ref);
            if (snap.exists()) {
                const likes = snap.data().likes || [];
                if (likes.includes(currentUid)) await updateDoc(ref, { likes: arrayRemove(currentUid) });
                else await updateDoc(ref, { likes: arrayUnion(currentUid) });
            }
        };

        window.toggleComments = function(postId) {
            document.getElementById(`comments-${postId}`).classList.toggle('active');
        };

        window.submitComment = async function(e, postId) {
            e.preventDefault();
            const input = document.getElementById(`comment-input-${postId}`);
            const text = input.value.trim();
            if (!text) return;

            await updateDoc(doc(db, "forum_posts", postId), {
                comments: arrayUnion({ authorUid: currentUid, penulis: headerName.innerText, isi: text, createdAt: new Date().toISOString() })
            });
            input.value = '';
        };

        window.deletePost = async function(postId) {
            if (confirm("Hapus diskusi ini?")) {
                await deleteDoc(doc(db, "forum_posts", postId));
                showToast("Diskusi dihapus.");
            }
        };

        window.handleLogout = async function() {
            if (confirm("Keluar dari akun Sitenexs?")) {
                localStorage.clear(); sessionStorage.clear();
                try { await signOut(auth); } catch(e) {}
                window.location.replace("https://sitenexs.com/?logout=true");
            }
        };
    </script>
</body>
</html>
