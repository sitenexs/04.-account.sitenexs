<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profil Akun Mitra — Sitenexs</title>
    
    <!-- Meta SEO -->
    <meta name="description" content="Kelola informasi akun, profil, foto, logo bisnis, paket langganan, dan riwayat aktivitas Anda di ekosistem Sitenexs.">
    <link rel="icon" type="image/png" href="https://sitenexs.com/assets/logo/logo.png">

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            --primary: #2563eb;
            --primary-dark: #1d4ed8;
            --primary-light: #eff6ff;
            --accent: #10b981;
            --bg-body: #f8fafc;
            --bg-card: #ffffff;
            --bg-alt: #f1f5f9;
            --text-main: #0f172a;
            --text-muted: #475569;
            --border-subtle: #e2e8f0;
            --border-medium: #cbd5e1;
            --border-accent: #93c5fd;
            --shadow-sm: 0 1px 3px rgba(15, 23, 42, 0.05);
            --shadow-md: 0 4px 12px -2px rgba(15, 23, 42, 0.08);
            --shadow-lg: 0 15px 30px -5px rgba(15, 23, 42, 0.08);
            --shadow-card: 0 20px 40px -12px rgba(37, 99, 235, 0.15);
            --radius-sm: 0.375rem;
            --radius-md: 0.625rem;
            --radius-lg: 1rem;
            --radius-xl: 1.5rem;
            --radius-full: 9999px;
            --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        /* SISTEM TEMA PAKET LANGGANAN */
        body[data-package="pro"] {
            --primary: #0284c7;
            --primary-dark: #0369a1;
            --primary-light: #f0f9ff;
            --accent: #f59e0b;
            --border-accent: #38bdf8;
            --shadow-card: 0 20px 40px -12px rgba(2, 132, 199, 0.22);
        }

        body[data-package="pro"] .profile-header-card::before {
            background: linear-gradient(90deg, #0284c7 0%, #f59e0b 100%);
        }

        body[data-package="pro"] .btn-primary {
            background: linear-gradient(135deg, #0284c7 0%, #0369a1 100%);
            box-shadow: 0 4px 15px rgba(2, 132, 199, 0.35);
        }

        body[data-package="vip"],
        body[data-package="ultimate"],
        body[data-package="premium"] {
            --primary: #7c3aed;
            --primary-dark: #6d28d9;
            --primary-light: #f5f3ff;
            --accent: #fbbf24;
            --border-accent: #c084fc;
            --shadow-card: 0 25px 50px -12px rgba(124, 58, 237, 0.28);
        }

        body[data-package="vip"] #navbar,
        body[data-package="ultimate"] #navbar,
        body[data-package="premium"] #navbar {
            border-bottom: 2px solid transparent;
            border-image: linear-gradient(90deg, #7c3aed, #fbbf24, #7c3aed) 1;
        }

        body[data-package="vip"] .profile-header-card,
        body[data-package="ultimate"] .profile-header-card,
        body[data-package="premium"] .profile-header-card {
            background: linear-gradient(145deg, #ffffff 0%, #faf5ff 100%);
            border: 1px solid rgba(124, 58, 237, 0.3);
            box-shadow: 0 20px 45px -10px rgba(124, 58, 237, 0.25);
        }

        body[data-package="vip"] .profile-header-card::before,
        body[data-package="ultimate"] .profile-header-card::before,
        body[data-package="premium"] .profile-header-card::before {
            height: 6px;
            background: linear-gradient(90deg, #7c3aed 0%, #fbbf24 50%, #d97706 100%);
        }

        body[data-package="vip"] .btn-primary,
        body[data-package="ultimate"] .btn-primary,
        body[data-package="premium"] .btn-primary {
            background: linear-gradient(135deg, #7c3aed 0%, #d97706 100%);
            box-shadow: 0 6px 20px rgba(124, 58, 237, 0.4);
            border: 1px solid rgba(254, 240, 138, 0.5);
        }

        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
        html { scroll-behavior: smooth; font-size: 15px; }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: var(--bg-body);
            color: var(--text-main);
            line-height: 1.4;
            -webkit-font-smoothing: antialiased;
            overflow-x: hidden;
            transition: background-color 0.4s ease, color 0.4s ease;
        }

        body.dialog-open { overflow: hidden; }
        a { text-decoration: none; color: inherit; }
        ul { list-style: none; }
        button, input, textarea, select { font-family: inherit; outline: none; border: none; }

        .container { width: 100%; max-width: 680px; margin: 0 auto; padding: 0 1rem; }

        .text-primary { color: var(--primary); }
        .text-muted { color: var(--text-muted); }

        /* BUTTONS */
        .btn {
            display: inline-flex; align-items: center; justify-content: center; gap: 0.4rem;
            padding: 0.6rem 1.2rem; font-size: 0.85rem; font-weight: 700;
            border-radius: var(--radius-full); cursor: pointer; transition: var(--transition);
            white-space: nowrap; border: 1px solid transparent; text-align: center;
        }
        .btn-primary { background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%); color: #fff; box-shadow: 0 4px 12px rgba(37, 99, 235, 0.25); }
        .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 6px 16px rgba(37, 99, 235, 0.35); }
        .btn-secondary { background: #fff; border: 1px solid var(--border-medium); color: var(--text-main); box-shadow: var(--shadow-sm); }
        .btn-secondary:hover { border-color: var(--primary); color: var(--primary); }
        .btn-danger { background: #fee2e2; color: #ef4444; border: 1px solid #fecaca; }
        .btn-danger:hover { background: #ef4444; color: #fff; }
        
        .btn-icon-only {
            width: 38px; height: 38px; padding: 0; border-radius: 50%;
            display: inline-flex; align-items: center; justify-content: center; font-size: 0.95rem;
        }

        /* NAVBAR */
        #navbar {
            position: sticky; top: 0; z-index: 1000; background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(12px); border-bottom: 1px solid var(--border-subtle); box-shadow: var(--shadow-sm);
            transition: border-color 0.3s ease;
        }
        .nav-container { display: flex; align-items: center; justify-content: space-between; height: 65px; width: 100%; max-width: 680px; margin: 0 auto; padding: 0 1rem; }
        .logo { display: flex; align-items: center; gap: 0.5rem; font-weight: 800; font-size: 1.1rem; color: var(--text-main); }
        .logo img { height: 32px; width: 32px; border-radius: 50%; object-fit: cover; border: 2px solid #fff; box-shadow: var(--shadow-sm); }
        .logo-text { background: linear-gradient(135deg, #1e3a8a 0%, #2563eb 50%, #10b981 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; text-transform: uppercase; font-weight: 800; letter-spacing: -0.02em; }
        .nav-actions { display: flex; gap: 0.4rem; align-items: center; }

        /* PROFILE LAYOUT */
        .profile-wrapper { padding: 1.5rem 0 4rem 0; width: 100%; }
        
        .profile-header-card {
            background: var(--bg-card); border: 1px solid var(--border-subtle); border-radius: var(--radius-xl);
            padding: 1.75rem 1.25rem; box-shadow: var(--shadow-md); display: flex; flex-direction: column; align-items: center;
            text-align: center; margin-bottom: 1.25rem; position: relative; overflow: hidden;
            transition: var(--transition);
        }

        .profile-header-card::before {
            content: ''; position: absolute; top: 0; left: 0; right: 0; height: 5px;
            background: linear-gradient(90deg, var(--primary) 0%, var(--accent) 100%);
            transition: var(--transition);
        }

        .profile-avatar-container {
            position: relative; width: 110px; height: 110px; margin-bottom: 0.85rem;
        }
        .profile-avatar-wrapper {
            width: 110px; height: 110px; border-radius: 50%; overflow: hidden; border: 3px solid var(--primary-light);
            box-shadow: var(--shadow-md); background: #e2e8f0; display: grid; place-items: center; position: relative;
        }
        .profile-avatar {
            width: 100%; height: 100%; object-fit: cover; display: block;
        }
        .avatar-initials {
            font-size: 2rem; font-weight: 800; color: var(--text-muted); background: #cbd5e1;
            width: 100%; height: 100%; display: grid; place-items: center;
        }
        .create-post-trigger-btn {
            position: absolute; bottom: 4px; right: 4px; background: var(--primary); color: #fff;
            width: 26px; height: 26px; border-radius: 50%; display: flex; align-items: center; justify-content: center;
            font-size: 0.7rem; cursor: pointer; border: 2px solid #fff; transition: var(--transition);
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
        }
        .create-post-trigger-btn:hover { background: var(--primary-dark); transform: scale(1.1); }

        .profile-name-row { display: flex; align-items: center; justify-content: center; gap: 0.35rem; margin-bottom: 0.15rem; flex-wrap: wrap; }
        .profile-name { font-size: 1.2rem; font-weight: 800; color: var(--text-main); line-height: 1.3; }
        .verified-badge { width: 16px; height: 16px; object-fit: contain; }
        .profile-email { font-size: 0.82rem; color: var(--text-muted); margin-bottom: 0.75rem; word-break: break-all; }
        
        .profile-badges-wrapper {
            display: flex; flex-direction: column; align-items: center; gap: 0.4rem; margin-bottom: 1rem; width: 100%;
        }
        .profile-business-tag { font-size: 0.75rem; font-weight: 700; color: var(--primary); background: var(--primary-light); padding: 0.25rem 0.8rem; border-radius: var(--radius-full); display: inline-flex; align-items: center; gap: 0.35rem; border: 1px solid rgba(37,99,235,0.15); }

        .profile-stats {
            display: flex; gap: 2rem; border-top: 1px solid var(--border-subtle); border-bottom: 1px solid var(--border-subtle);
            padding: 0.75rem 1rem; width: 100%; justify-content: center; margin-bottom: 0.25rem;
        }
        .stat-item { text-align: center; }
        .stat-value { font-weight: 800; font-size: 1.05rem; color: var(--text-main); }
        .stat-label { font-size: 0.68rem; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.05em; margin-top: 0.1rem; }

        .profile-card {
            background: var(--bg-card); border: 1px solid var(--border-subtle); border-radius: var(--radius-xl);
            padding: 1.25rem; box-shadow: var(--shadow-sm); margin-bottom: 1.25rem;
            transition: var(--transition);
        }
        .card-title { font-size: 0.95rem; font-weight: 800; margin-bottom: 1rem; display: flex; align-items: center; justify-content: space-between; color: var(--text-main); }
        
        .my-posts-list { 
            display: flex; 
            flex-direction: column; 
            gap: 0.85rem; 
            width: 100%;
        }

        /* =========================================================
           DESAIN KARTU POSTINGAN
           ========================================================= */
        .post-card {
            background: var(--bg-card); border: 1px solid var(--border-subtle); border-radius: var(--radius-md);
            padding: 0; box-shadow: var(--shadow-sm); transition: var(--transition); animation: fadeIn 0.3s ease; width: 100%; overflow: hidden;
            user-select: none; -webkit-touch-callout: none; text-align: left; position: relative;
        }
        .post-card-inner { padding: 0.85rem; }
        
        @keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
        
        .post-header { display: flex; align-items: flex-start; justify-content: space-between; margin-bottom: 0.65rem; gap: 0.4rem; }
        .post-author { display: flex; align-items: center; gap: 0.5rem; min-width: 0; flex: 1; }
        
        .post-author-img { width: 34px; height: 34px; border-radius: 50%; object-fit: cover; border: 1px solid rgba(0,0,0,0.08); flex-shrink: 0; }
        
        .author-info { display: flex; flex-direction: column; justify-content: center; min-width: 0; }
        
        .author-name-row { display: flex; align-items: center; gap: 0.25rem; min-width: 0; }
        .author-name-link { text-decoration: none; color: inherit; display: inline-flex; align-items: center; min-width: 0; }
        .author-name-link:hover .author-name { text-decoration: underline; color: var(--primary); }
        .author-name { 
            font-weight: 800; 
            font-size: 0.85rem; 
            color: var(--text-main); 
            white-space: nowrap; 
            overflow: hidden; 
            text-overflow: ellipsis; 
            line-height: 1.3; 
            transition: color 0.2s; 
            padding-bottom: 1px;
        }
        .member-verification-icon { width: 13px; height: 13px; object-fit: contain; flex-shrink: 0; transform: translateY(0.5px); }
        
        .author-time-wrapper { display: flex; align-items: center; gap: 0.4rem; font-size: 0.65rem; color: var(--text-muted); font-weight: 500; margin-top: 0.05rem; }
        
        /* TOMBOL MENU TITIK TIGA (...) DI POJOK KANAN ATAS POSTINGAN */
        .post-options-container { position: relative; }
        .post-options-btn {
            background: transparent; border: none; width: 28px; height: 28px; border-radius: 50%;
            display: flex; align-items: center; justify-content: center; color: var(--text-muted);
            cursor: pointer; transition: var(--transition); font-size: 0.9rem;
        }
        .post-options-btn:hover { background: var(--bg-body); color: var(--text-main); }

        .post-options-dropdown {
            position: absolute; top: 100%; right: 0; background: #fff; border: 1px solid var(--border-subtle);
            border-radius: var(--radius-md); box-shadow: var(--shadow-md); width: 230px; z-index: 100;
            display: none; padding: 0.4rem; animation: fadeIn 0.2s ease;
        }
        .post-options-dropdown.active { display: block; }
        .option-item {
            display: flex; align-items: center; gap: 0.5rem; padding: 0.5rem 0.75rem;
            font-size: 0.75rem; font-weight: 600; color: var(--text-main); border-radius: var(--radius-sm);
            cursor: pointer; transition: var(--transition); background: transparent; width: 100%; text-align: left;
        }
        .option-item:hover { background: var(--primary-light); color: var(--primary); }
        .option-item i { width: 16px; text-align: center; }

        .post-badge {
            font-size: 0.6rem; font-weight: 700; padding: 0.15rem 0.4rem; border-radius: var(--radius-full);
            background: var(--bg-body); color: var(--text-muted); flex-shrink: 0; border: 1px solid var(--border-subtle);
        }
        .badge-pengumuman { background: #fef2f2; color: #ef4444; border-color: #fca5a5; }
        .badge-tips { background: #fffbeb; color: #d97706; border-color: #fcd34d; }
        .badge-bug { background: #faf5ff; color: #7e22ce; border-color: #d8b4fe; }

        .post-title { font-size: 0.95rem; font-weight: 800; margin-bottom: 0.3rem; line-height: 1.3; color: var(--text-main); word-break: break-word; }
        .post-content { font-size: 0.8rem; color: var(--text-main); margin-bottom: 0.65rem; line-height: 1.45; white-space: pre-wrap; word-break: break-word; }
        .post-image { width: 100%; max-height: 350px; object-fit: cover; border-radius: var(--radius-sm); margin-bottom: 0.65rem; border: 1px solid var(--border-subtle); }

        /* TOMBOL AKSI GAYA SOSMED & SEJAJAR RAPI */
        .post-actions {
            display: flex; 
            align-items: center; 
            justify-content: space-between; 
            border-top: 1px solid var(--border-subtle); 
            padding: 0.3rem 0.5rem; 
            gap: 0.25rem;
        }
        .action-btn { 
            flex: 1 1 0px; 
            display: inline-flex; 
            align-items: center; 
            justify-content: center; 
            gap: 0.35rem; 
            color: var(--text-muted); 
            font-size: 0.75rem; 
            font-weight: 600; 
            cursor: pointer; 
            transition: all 0.2s; 
            background: transparent; 
            padding: 0.45rem 0.2rem; 
            border-radius: var(--radius-sm);
            border: none;
            white-space: nowrap;
        }
        .action-btn:hover { background: var(--bg-body); color: var(--text-main); }
        .action-btn.liked { color: #ef4444; }

        .action-btn.delete-btn { color: #ef4444; }
        .action-btn.delete-btn:hover { background: #fef2f2; color: #dc2626; }

        @keyframes likePop {
            0% { transform: scale(1); }
            50% { transform: scale(1.35); }
            100% { transform: scale(1); }
        }
        .action-btn.liked i { 
            font-weight: 900; 
            animation: likePop 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275); 
        }

        /* KOMENTAR SECTION - DENGAN ANIMASI BUKA/TUTUP */
        .comments-section {
            background: #fafafa; border-top: 1px solid var(--border-subtle);
            padding: 0.85rem; display: none;
            opacity: 0;
            transform: translateY(-8px);
            transition: opacity 0.25s ease, transform 0.25s ease;
        }
        .comments-section.active { 
            display: block; 
            opacity: 1;
            transform: translateY(0);
            animation: commentSlideIn 0.25s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }
        @keyframes commentSlideIn {
            from { opacity: 0; transform: translateY(-8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .comment-list { display: flex; flex-direction: column; gap: 0.65rem; margin-bottom: 0.85rem; max-height: 250px; overflow-y: auto; padding-right: 0.4rem; }
        
        .comment-item { 
            display: flex; gap: 0.5rem; align-items: flex-start; 
            transition: all 0.3s ease; border-radius: var(--radius-md); padding: 0.15rem;
        }
        .comment-avatar { width: 28px; height: 28px; border-radius: 50%; object-fit: cover; border: 1px solid var(--border-subtle); flex-shrink: 0; }
        
        .comment-content-wrapper { flex: 1; min-width: 0; }
        .comment-bubble {
            background: var(--bg-body); padding: 0.4rem 0.6rem; 
            border-radius: 0 var(--radius-md) var(--radius-md) var(--radius-md);
            display: inline-block; width: 100%; border: 1px solid var(--border-subtle);
        }
        
        .comment-header-row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 0.15rem; }
        .comment-author-left { display: flex; align-items: center; gap: 0.25rem; min-width: 0; }
        .comment-author-link { text-decoration: none; color: inherit; display: inline-flex; align-items: center; min-width: 0; }
        .comment-author-link:hover .comment-author { text-decoration: underline; color: var(--primary); }
        .comment-author { 
            font-weight: 800; 
            font-size: 0.75rem; 
            color: var(--text-main); 
            line-height: 1.3; 
            transition: color 0.2s; 
            padding-bottom: 1px;
        }
        
        .comment-text { font-size: 0.75rem; color: var(--text-main); word-break: break-word; line-height: 1.35; }
        .comment-text .mention-link { color: var(--primary); font-weight: 700; text-decoration: none; }
        .comment-text .mention-link:hover { text-decoration: underline; }

        .comment-footer-row { display: flex; align-items: center; gap: 0.5rem; margin-top: 0.2rem; margin-left: 0.3rem; }
        .comment-time { font-size: 0.6rem; color: var(--text-muted); font-weight: 500; }
        .reply-trigger-btn { background: none; border: none; color: var(--primary); font-size: 0.65rem; font-weight: 700; cursor: pointer; padding: 0; transition: var(--transition); }
        .reply-trigger-btn:hover { text-decoration: underline; }
        .delete-comment-btn { background: none; border: none; color: #ef4444; font-size: 0.65rem; font-weight: 700; cursor: pointer; padding: 0; transition: var(--transition); }
        .delete-comment-btn:hover { text-decoration: underline; }

        /* FOKUS KOMENTAR & BLUR */
        .comments-section.comment-focus-mode .comment-item:not(.focused-comment) {
            filter: blur(4px);
            opacity: 0.35;
            pointer-events: none;
            user-select: none;
            transition: all 0.3s ease;
        }
        .comment-item.focused-comment {
            position: relative;
            z-index: 50;
            transform: scale(1.02);
            background: #fff;
            box-shadow: 0 4px 16px rgba(15, 23, 42, 0.12);
            border: none;
            padding: 0.3rem;
            transition: all 0.3s ease;
        }

        /* MENTION AUTOCOMPLETE DROPDOWN */
        .mention-dropdown {
            position: absolute; bottom: 100%; left: 0; background: #fff;
            border: 1px solid var(--border-medium); border-radius: var(--radius-md);
            box-shadow: var(--shadow-md); width: 220px; max-height: 150px; overflow-y: auto;
            z-index: 100; display: none; margin-bottom: 4px;
        }
        .mention-dropdown.active { display: block; }
        .mention-item {
            display: flex; align-items: center; gap: 0.5rem; padding: 0.4rem 0.6rem;
            font-size: 0.75rem; cursor: pointer; border-bottom: 1px solid var(--border-subtle);
            transition: var(--transition); color: var(--text-main);
        }
        .mention-item:hover, .mention-item.selected { background: var(--primary-light); color: var(--primary); }
        .mention-item img { width: 20px; height: 20px; border-radius: 50%; object-fit: cover; }

        .comment-form { display: flex; gap: 0.5rem; align-items: center; position: relative; }
        .comment-form-avatar { width: 28px; height: 28px; border-radius: 50%; object-fit: cover; border: 1px solid var(--border-subtle); flex-shrink: 0; }
        .comment-input-wrapper { flex: 1; display: flex; align-items: center; background: #fff; border: 1px solid var(--border-medium); border-radius: var(--radius-full); padding: 0.15rem 0.15rem 0.15rem 0.65rem; transition: var(--transition); position: relative; }
        .comment-input-wrapper:focus-within { border-color: var(--primary); box-shadow: 0 0 0 2px var(--primary-light); }
        .comment-input { flex: 1; background: transparent; font-size: 0.75rem; color: var(--text-main); height: 28px; }
        .comment-submit-btn { width: 28px; height: 28px; border-radius: 50%; background: var(--primary); color: #fff; display: flex; align-items: center; justify-content: center; cursor: pointer; transition: var(--transition); flex-shrink: 0; border: none; }
        .comment-submit-btn:hover { background: var(--primary-dark); transform: scale(1.05); }

        /* MODE FOKUS & BLUR POST CARD */
        body.forum-focus-mode header,
        body.forum-focus-mode .profile-header-card,
        body.forum-focus-mode .card-title,
        body.forum-focus-mode .post-card:not(.focused-card) {
            filter: blur(5px);
            opacity: 0.35;
            pointer-events: none;
            user-select: none;
            transition: all 0.3s ease;
        }
        .post-card.focused-card {
            position: relative;
            z-index: 9999;
            transform: scale(1.02);
            box-shadow: 0 15px 35px rgba(15, 23, 42, 0.25);
            border-color: var(--primary);
            transition: all 0.3s ease;
        }
        .focus-backdrop {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;

            try {
                const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                const osc = audioCtx.createOscillator();
                const gainNode = audioCtx.createGain();

                osc.type = 'sine';
                if (isLiked) {

                    osc.frequency.setValueAtTime(600, audioCtx.currentTime);

                gainNode.gain.setValueAtTime(0.15, audioCtx.currentTime);

                osc.connect(gainNode);
                gainNode.connect(audioCtx.destination);

                const queryStr = match[1].toLowerCase();
                const filtered = allRegisteredUsers.filter(u => u.nama.toLowerCase().includes(queryStr));

                if (filtered.length > 0) {
                    let html = '';
                    filtered.forEach(u => {
                        const fallbackAv = `https://ui-avatars.com/api/?name=${encodeURIComponent(u.nama)}&background=2563eb&color=fff`;
                        html += `
                            <div class="mention-item" onclick="selectMention('${postId}', '${u.nama.replace(/'/g, "\\'")}')">
                                <img src="${u.avatar}" onerror="this.src='${fallbackAv}'">
                                <span>${u.nama}</span>
                            </div>
                        `;
                    });
                    dropdown.innerHTML = html;
                    dropdown.classList.add('active');
                } else {
                    dropdown.classList.remove('active');
                }
            } else {
                dropdown.classList.remove('active');
            }
        }

        window.selectMention = function(postId, name) {
            const input = document.getElementById(`comment-input-${postId}`);
            const dropdown = document.getElementById(`mention-dropdown-${postId}`);
            const cursorPos = input.selectionStart;
            const val = input.value;

            const textBefore = val.substring(0, cursorPos);
            const textAfter = val.substring(cursorPos);
            const newTextBefore = textBefore.replace(/@([a-zA-Z0-9_\s]*)$/, `@${name} `);

            input.value = newTextBefore + textAfter;
            dropdown.classList.remove('active');
            input.focus();
            input.setSelectionRange(newTextBefore.length, newTextBefore.length);
        }

        function formatCommentText(text) {
            if (!text) return '';
            const sortedUsers = [...allRegisteredUsers].sort((a, b) => b.nama.length - a.nama.length);
            
            let formatted = text;
            sortedUsers.forEach(u => {
                const escapedName = u.nama.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
                const regex = new RegExp(`@(${escapedName})\\b`, 'gi');
                formatted = formatted.replace(regex, (match, p1) => {
                    return `<a href="https://sitenexs.com/community/profile?uid=${encodeURIComponent(u.uid)}" class="mention-link">@${p1}</a>`;
                });
            });
            return formatted;
        }

        function timeAgo(date) {
            if (!date) return 'Baru saja';
            const seconds = Math.floor((new Date() - date) / 1000);
            let interval = seconds / 31536000;
            if (interval > 1) return Math.floor(interval) + "th lalu";
            interval = seconds / 2592000;
            if (interval > 1) return Math.floor(interval) + "bln lalu";
            interval = seconds / 86400;
            if (interval > 1) return Math.floor(interval) + "hr lalu";
            interval = seconds / 3600;
            if (interval > 1) return Math.floor(interval) + "j lalu";
            interval = seconds / 60;
            if (interval > 1) return Math.floor(interval) + "m lalu";
            return "Baru saja";
        }

        function clampCropPosition() {
            const drawnWidth = cropImage.width * cropBaseScale * cropZoom;
            const drawnHeight = cropImage.height * cropBaseScale * cropZoom;
            cropX = Math.min(0, Math.max(cropSize - drawnWidth, cropX));
            cropY = Math.min(0, Math.max(cropSize - drawnHeight, cropY));
        }

        function drawCropPreview() {
            if (!cropImage) return;
            const drawnWidth = cropImage.width * cropBaseScale * cropZoom;
            const drawnHeight = cropImage.height * cropBaseScale * cropZoom;
            cropContext.clearRect(0, 0, cropSize, cropSize);
            cropContext.drawImage(cropImage, cropX, cropY, drawnWidth, drawnHeight);
        }

        function releaseCropImage() {
            if (cropImage) cropImage.close();
            cropImage = null;
            dragPosition = null;
            avatarFileInput.value = '';
            document.body.classList.remove('dialog-open');
        }

        function setCropZoom(nextZoom) {
            const oldScale = cropBaseScale * cropZoom;
            const imageCenterX = (cropSize / 2 - cropX) / oldScale;
            const imageCenterY = (cropSize / 2 - cropY) / oldScale;
            cropZoom = Number(nextZoom);
            const nextScale = cropBaseScale * cropZoom;
            cropX = cropSize / 2 - imageCenterX * nextScale;
            cropY = cropSize / 2 - imageCenterY * nextScale;
            clampCropPosition();
            requestAnimationFrame(drawCropPreview);
        }

        async function openCropEditor(file) {
            try {
                cropImage = await createImageBitmap(file);
                cropBaseScale = cropSize / Math.min(cropImage.width, cropImage.height);
                cropZoom = 1;
                cropX = (cropSize - cropImage.width * cropBaseScale) / 2;
                cropY = (cropSize - cropImage.height * cropBaseScale) / 2;
                cropZoomInput.value = '1';
                drawCropPreview();
                document.body.classList.add('dialog-open');
                cropDialog.showModal();
            } catch (error) {
                releaseCropImage();
                showToast("Foto tidak dapat dibuka.", "error");
            }
        }

                                    <div class="author-time-wrapper">
                                        <span>${waktuString}</span>
                                        ${isPrivate ? '<span style="color:#f59e0b; display:inline-flex; align-items:center; gap:0.2rem;"><i class="fas fa-lock"></i> Privat</span>' : ''}
                                    </div>
                                </div>
                            </div>

                            <div class="post-options-container">
                                <button type="button" class="post-options-btn" onclick="togglePostOptions('${postId}', event)" title="Pengaturan Postingan">
                                    <i class="fas fa-ellipsis-v"></i>
                                </button>
                                <div class="post-options-dropdown" id="options-dropdown-${postId}">
                                    <button type="button" class="option-item" onclick="updatePostSetting('${postId}', 'isPrivate', ${!isPrivate})">
                                        <i class="fas ${isPrivate ? 'fa-globe text-primary' : 'fa-lock'}"></i> ${isPrivate ? 'Ubah ke Publik' : 'Ubah ke Privat'}
                                    </button>
                                    <button type="button" class="option-item" onclick="updatePostSetting('${postId}', 'commentsDisabled', ${!commentsDisabled})">
                                        <i class="fas ${commentsDisabled ? 'fa-comments' : 'fa-comment-slash'}"></i> ${commentsDisabled ? 'Izinkan Komentar' : 'Nonaktifkan Komentar'}
                                    </button>
                                    <button type="button" class="option-item" onclick="updatePostSetting('${postId}', 'hideStats', ${!hideStats})">
                                        <i class="fas ${hideStats ? 'fa-eye' : 'fa-eye-slash'}"></i> ${hideStats ? 'Tampilkan Suka & Komentar' : 'Sembunyikan Suka & Komentar'}
                                    </button>
                                </div>
                            </div>
                        </div>
                        
                        ${postTitleHtml}
                        <p class="post-content">${isi}</p>
                        ${postImageHtml}
                    </div>
                    
                    <div class="post-actions">
                        <button class="action-btn ${isLiked ? 'liked' : ''}" onclick="toggleLike('${postId}')">
                            <i class="${isLiked ? 'fas' : 'far'} fa-thumbs-up"></i> 
                            <span>${likeDisplay}</span>
                        </button>
                        ${!commentsDisabled ? `
                        <button class="action-btn" onclick="toggleComments('${postId}')">
                            <i class="far fa-comment-alt"></i> 
                            <span>${commentDisplay}</span>
                        </button>` : ''}
                        <button class="action-btn delete-btn" title="Hapus Diskusi" onclick="deletePost('${postId}')">
                            <i class="fas fa-trash-alt"></i> 
                            <span>Hapus</span>
                        </button>
                    </div>

                    ${!commentsDisabled ? `
                    <div class="comments-section" id="comments-${postId}">
                        <div class="comment-list">
                            ${commentsHtml}
                        </div>
                        <form class="comment-form" onsubmit="submitComment(event, '${postId}')">
                            <img src="${activeAvatarUrl}" class="comment-form-avatar" onerror="this.onerror=null; this.src='${activeFallback}';">
                            <div class="comment-input-wrapper">
                                <input type="text" id="comment-input-${postId}" class="comment-input" placeholder="Tulis komentar atau ketik @..." oninput="handleCommentInput(event, '${postId}')" required>
                                <div class="mention-dropdown" id="mention-dropdown-${postId}"></div>
                                <button type="submit" class="comment-submit-btn"><i class="fas fa-paper-plane" style="font-size: 0.7rem;"></i></button>
                            </div>
                        </form>
                    </div>` : ''}
                </article>
            `;
        }

        // --- PEMERIKSAAN DINAMIS STATUS VERIFIKASI & LENCANA KUNING ---
        function runAsyncVerifBadges() {
            setTimeout(() => {
                document.querySelectorAll('.async-verif-badge').forEach(async (el) => {
                    const uid = el.getAttribute('data-uid');
                    if (!uid || uid === 'unknown') return;
                    
                    try {
                        const snap = await getDoc(doc(db, "users", uid));
                        if (snap.exists()) {
                            const d = snap.data();
                            const isVerified = Boolean(d.isVerified) || Boolean(d.isFounder) || Boolean(d.isDeveloper);
                            const isPro = Boolean(d.isPro) || Boolean(d.lencanaKuning) || Boolean(d.isLencanaKuning);
                            
                            let badgesHtml = '';
                            if (isVerified) {
                                badgesHtml += `<img src="https://sitenexs.com/assets/logo/verified.png" class="member-verification-icon" alt="Verified" title="Verified">`;
                            }
                            if (isPro) {
                                badgesHtml += `<img src="https://sitenexs.com/assets/logo/lencana.png" class="member-verification-icon" alt="Pro Badge" title="Lencana Pro" style="margin-left: 2px;">`;
                            }
                            el.innerHTML = badgesHtml;
                        } else {
                            el.innerHTML = '';
                        }
                    } catch(e) {
                        el.innerHTML = '';
                    }
                });
            }, 100);
        }

        function subscribeUserPosts(uid) {
            const qPosts = query(collection(db, "forum_posts"), where("authorUid", "==", uid));
            
            onSnapshot(qPosts, (snapshot) => {
                statPostCount.innerText = snapshot.size;

                let totalLikes = 0;
                const docsList = [];
                snapshot.forEach(docSnap => {
                    const data = docSnap.data();
                    docsList.push({ id: docSnap.id, docSnap: docSnap, data: data });
                    if (Array.isArray(data.likes)) {
                        totalLikes += data.likes.length;
                    }
                });
                statLikeCount.innerText = totalLikes;

                if (docsList.length === 0) {
                    myPostsContainer.innerHTML = '<div class="loader-container"><p>Anda belum pernah membuat postingan di komunitas.</p></div>';
                    isInitialLoad = false;
                    return;
                }

                docsList.sort((a, b) => {
                    const timeA = a.data.createdAt ? a.data.createdAt.toDate().getTime() : 0;
                    const timeB = b.data.createdAt ? b.data.createdAt.toDate().getTime() : 0;
                    return timeB - timeA;
                });

                if (isInitialLoad) {
                    let html = "";
                    docsList.forEach(item => {
                        html += renderPostCardHtml(item.id, item.data, uid);
                    });
                    myPostsContainer.innerHTML = html;
                    isInitialLoad = false;
                    runAsyncVerifBadges();
                    return;
                }

                const existingCards = {};
                document.querySelectorAll('.my-posts-list .post-card').forEach(card => {
                    existingCards[card.getAttribute('data-post-id')] = card;
                });

                const currentSnapshotIds = new Set();
                const tempDiv = document.createElement('div');

                docsList.forEach(item => {
                    const postId = item.id;
                    const data = item.data;
                    currentSnapshotIds.add(postId);
                    const existingCard = existingCards[postId];

                    const likes = data.likes || [];
                    const isLiked = likes.includes(uid);
                    const likeCount = likes.length;
                    const hideStats = data.hideStats === true;
                    const likeDisplay = hideStats ? 'Suka' : `${likeCount > 0 ? likeCount : ''} Suka`;
                    const comments = data.comments || [];
                    const commentDisplay = hideStats ? 'Komentar' : `${comments.length > 0 ? comments.length : ''} Komentar`;

                    if (existingCard) {
                        const likeBtn = existingCard.querySelector('.action-btn');
                        if (likeBtn && document.activeElement !== likeBtn) {
                            if (isLiked) {
                                likeBtn.classList.add('liked');
                                likeBtn.querySelector('i').className = 'fas fa-thumbs-up';
                            } else {
                                likeBtn.classList.remove('liked');
                                likeBtn.querySelector('i').className = 'far fa-thumbs-up';
                            }
                            likeBtn.querySelector('span').innerText = likeDisplay;
                        }

                        const commentBtn = existingCard.querySelectorAll('.action-btn')[1];
                        if (commentBtn) {
                            commentBtn.querySelector('span').innerText = commentDisplay;
                        }

                        const commentsListEl = existingCard.querySelector('.comment-list');
                        if (commentsListEl && document.activeElement.id !== `comment-input-${postId}`) {
                            let commentsHtml = '';
                            comments.forEach(c => {
                                const cDate = c.createdAt ? timeAgo(new Date(c.createdAt)) : 'Baru saja';
                                const cAuthorUid = c.authorUid || 'unknown';
                                const cAvatar = `${supabaseUrl}/storage/v1/object/public/${avatarBucket}/${encodeURIComponent(cAuthorUid)}/profile-photo`;
                                const cFallback = `https://ui-avatars.com/api/?name=${encodeURIComponent(c.penulis || 'Mitra')}&background=random&color=fff`;
                                
                                const cVerified = `<span class="async-verif-badge" data-uid="${cAuthorUid}"></span>`;

                                const formattedText = formatCommentText(c.isi || '');
                                const isMyComment = (cAuthorUid === uid);
                                const deleteBtnHtml = isMyComment ? `<button type="button" class="delete-comment-btn" onclick="deleteComment('${postId}', '${c.createdAt}', '${cAuthorUid}')">Hapus</button>` : '';

                                commentsHtml += `
                                    <div class="comment-item">
                                        <a href="https://sitenexs.com/community/profile?uid=${encodeURIComponent(cAuthorUid)}" style="flex-shrink: 0;">
                                            <img src="${cAvatar}" alt="${c.penulis || 'Mitra'}" class="comment-avatar" onerror="this.onerror=null; this.src='${cFallback}';">
                                        </a>
                                        <div class="comment-content-wrapper">
                                            <div class="comment-bubble">
                                                <div class="comment-header-row">
                                                    <div class="comment-author-left">
                                                        <a href="https://sitenexs.com/community/profile?uid=${encodeURIComponent(cAuthorUid)}" class="comment-author-link">
                                                            <span class="comment-author">${c.penulis || 'Mitra'}</span>
                                                        </a>
                                                        ${cVerified}
                                                    </div>
                                                </div>
                                                <div class="comment-text">${formattedText}</div>
                                            </div>
                                            <div class="comment-footer-row">
                                                <div class="comment-time">${cDate}</div>
                                                <button type="button" class="reply-trigger-btn" onclick="replyComment('${postId}', '${(c.penulis || 'Mitra').replace(/'/g, "\\'")}')">Balas</button>
                                                ${deleteBtnHtml}
                                            </div>
                                        </div>
                                    </div>
                                `;
                            });
                            if (comments.length === 0) {
                                commentsHtml = '<div style="font-size: 0.75rem; color: var(--text-muted); text-align: center; padding: 0.5rem 0;">Belum ada komentar. Jadilah yang pertama membalas!</div>';
                            }
                            commentsListEl.innerHTML = commentsHtml;
                        }
                    } else {
                        tempDiv.innerHTML = renderPostCardHtml(postId, data, uid);
                        const newCard = tempDiv.firstElementChild;
                        if (newCard) {
                            myPostsContainer.insertBefore(newCard, myPostsContainer.firstChild);
                        }
                    }
                });

                Object.keys(existingCards).forEach(postId => {
                    if (!currentSnapshotIds.has(postId)) {
                        existingCards[postId].remove();
                    }
                });

                runAsyncVerifBadges();
            }, (err) => {
                console.error("Gagal memuat postingan:", err);
            });
        }

        window.toggleLike = async function(postId) {
            if (!currentUid) {
                showToast("Silakan login terlebih dahulu.", "error");
                return;
            }

            const postCard = document.querySelector(`.post-card[data-post-id="${postId}"]`);
            const btn = postCard ? postCard.querySelector('.post-actions .action-btn') : null;
            
            if (btn) {
                const icon = btn.querySelector('i');
                const spanCount = btn.querySelector('span');
                const isCurrentlyLiked = btn.classList.contains('liked');
                
                btn.classList.toggle('liked', !isCurrentlyLiked);
                playLikeSound(!isCurrentlyLiked);

                let currentText = spanCount.innerText.trim();
                let currentNum = parseInt(currentText) || 0;
                let isHideStats = currentText.toLowerCase() === 'suka';

                if (!isHideStats) {
                    if (!isCurrentlyLiked) {
                        icon.className = 'fas fa-thumbs-up';
                        spanCount.innerText = `${currentNum + 1} Suka`;
                    } else {
                        icon.className = 'far fa-thumbs-up';
                        let newCount = Math.max(0, currentNum - 1);
                        spanCount.innerText = newCount > 0 ? `${newCount} Suka` : 'Suka';
                    }
                }
            }

            const postRef = doc(db, "forum_posts", postId);
            try {
                const postSnap = await getDoc(postRef);
                if (postSnap.exists()) {
                    const data = postSnap.data();
                    const likes = data.likes || [];
                    if (likes.includes(currentUid)) {
                        await updateDoc(postRef, { likes: arrayRemove(currentUid) });
                    } else {
                        await updateDoc(postRef, { likes: arrayUnion(currentUid) });
                    }
                }
            } catch (err) {
                console.error("Gagal melakukan like:", err);
                showToast("Gagal menyukai postingan.", "error");
            }
        };

        window.toggleComments = function(postId) {
            const section = document.getElementById(`comments-${postId}`);
            if (section) {
                section.classList.toggle('active');
            }
        };

        window.submitComment = async function(event, postId) {
            event.preventDefault();
            if (!currentUid) {
                showToast("Silakan login terlebih dahulu.", "error");
                return;
            }

            const inputEl = document.getElementById(`comment-input-${postId}`);
            const commentText = inputEl.value.trim();
            if (!commentText) return;

            const nameVal = headerName.innerText || currentUser?.displayName || "Mitra Sitenexs";
            const verifiedVal = currentUserData ? Boolean(currentUserData.isVerified) : false;

            const postRef = doc(db, "forum_posts", postId);
            try {
                const newComment = {
                    authorUid: currentUid,
                    penulis: nameVal,
                    isVerified: verifiedVal,
                    isi: commentText,
                    createdAt: new Date().toISOString()
                };

                await updateDoc(postRef, {
                    comments: arrayUnion(newComment)
                });

                inputEl.value = '';
                const dropdown = document.getElementById(`mention-dropdown-${postId}`);
                if (dropdown) dropdown.classList.remove('active');
            } catch (err) {
                console.error("Gagal mengirim komentar:", err);
                showToast("Terjadi kesalahan saat mengirim komentar.", "error");
            }
        };

        window.deleteComment = async function(postId, commentCreatedAt, commentAuthorUid) {
            if (!currentUid || currentUid !== commentAuthorUid) {
                showToast("Anda tidak memiliki izin menghapus komentar ini.", "error");
                return;
            }

            if (!confirm("Hapus komentar ini?")) return;

            const postRef = doc(db, "forum_posts", postId);
            try {
                const postSnap = await getDoc(postRef);
                if (postSnap.exists()) {
                    const data = postSnap.data();
                    const comments = data.comments || [];
                    const targetComment = comments.find(c => c.createdAt === commentCreatedAt);

                    if (targetComment) {
                        await updateDoc(postRef, {
                            comments: arrayRemove(targetComment)
                        });
                        showToast("Komentar berhasil dihapus.");
                    }
                }
            } catch (err) {
                console.error("Gagal menghapus komentar:", err);
                showToast("Terjadi kesalahan saat menghapus komentar.", "error");
            }
        };

        window.deletePost = async function(postId) {
            if (confirm("Apakah Anda yakin ingin menghapus diskusi ini? Tindakan ini tidak dapat dibatalkan.")) {
                try {
                    await deleteDoc(doc(db, "forum_posts", postId));
                    showToast("Diskusi berhasil dihapus!");
                } catch (err) {
                    console.error("Gagal menghapus postingan:", err);
                    showToast("Gagal menghapus diskusi.", "error");
                }
            }
        };

        let pressTimer = null;
        let startX = 0;
        let startY = 0;

        document.addEventListener('pointerdown', (e) => {
            if (e.target.closest('.comment-item.focused-comment')) return;

            if (e.target.closest('button, input, textarea, a, .post-actions, .mention-dropdown, .post-options-dropdown')) {
                if ((document.body.classList.contains('forum-focus-mode') && !e.target.closest('.post-card.focused-card')) ||
                    (document.querySelector('.comment-item.focused-comment') && !e.target.closest('.comment-item.focused-comment'))) {
                    exitFocusMode();
                }
                return;
            }

            if (document.querySelector('.comment-item.focused-comment') && !e.target.closest('.comment-item.focused-comment')) {
                exitFocusMode();
                return;
            }

            const commentItem = e.target.closest('.comment-item');
            if (commentItem) {
                startX = e.clientX;
                startY = e.clientY;
                pressTimer = setTimeout(() => {
                    activateCommentFocusMode(commentItem);
                }, 600);
                return;
            }

            const card = e.target.closest('.post-card');
            if (!card) {
                exitFocusMode();
                return;
            }

            startX = e.clientX;
            startY = e.clientY;
            pressTimer = setTimeout(() => {
                activateFocusMode(card);
            }, 600);
        });

        document.addEventListener('pointermove', (e) => {
            if (!pressTimer) return;
            if (Math.abs(e.clientX - startX) > 10 || Math.abs(e.clientY - startY) > 10) {
                clearTimeout(pressTimer);
                pressTimer = null;
            }
        });

        document.addEventListener('pointerup', () => {
            if (pressTimer) {
                clearTimeout(pressTimer);
                pressTimer = null;
            }
        });

        document.addEventListener('pointercancel', () => {
            if (pressTimer) {
                clearTimeout(pressTimer);
                pressTimer = null;
            }
        });

        window.activateFocusMode = function(card) {
            document.querySelectorAll('.post-card').forEach(c => c.classList.remove('focused-card'));
            card.classList.add('focused-card');
            document.body.classList.add('forum-focus-mode');
            if (navigator.vibrate) navigator.vibrate(50);
        };

        window.exitFocusMode = function() {
            document.body.classList.remove('forum-focus-mode');
            document.querySelectorAll('.post-card').forEach(c => c.classList.remove('focused-card'));
            document.querySelectorAll('.comments-section').forEach(sec => sec.classList.remove('comment-focus-mode'));
            document.querySelectorAll('.comment-item').forEach(item => item.classList.remove('focused-comment'));
        };

        window.activateCommentFocusMode = function(commentItem) {
            const section = commentItem.closest('.comments-section');
            if (!section) return;

            section.querySelectorAll('.comment-item').forEach(item => item.classList.remove('focused-comment'));
            commentItem.classList.add('focused-comment');
            section.classList.add('comment-focus-mode');
            if (navigator.vibrate) navigator.vibrate(50);
        };

        window.handleLogout = async function() {
            if (confirm("Apakah Anda yakin ingin keluar dari akun Sitenexs?")) {
                localStorage.removeItem('sitenexs_uid');
                localStorage.removeItem('sitenexs_logged_in');
                localStorage.removeItem('sitenexs_show_welcome');
                sessionStorage.clear();
                
                try {
                    await signOut(auth);
                } catch(e) {}

                window.location.replace("https://sitenexs.com/?logout=true");
            }
        };
    </script>
</body>
</html>
